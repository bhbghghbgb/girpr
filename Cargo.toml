[package]
name = "girpr"
version = "0.1.0"
edition = "2024"
# The single-writer lock uses `File::try_lock`/`File::unlock`, stable since
# 1.89; edition 2024 and the dependency tree need less than that.
rust-version = "1.89"
description = "Genshin Impact low-disk repair patcher (Starward chunk-repair core + Collapse extra purge)"

[[bin]]
name = "girpr"
path = "src/main.rs"

[workspace]
members = [".", "crates/log", "crates/tempdir", "tools/sync", "tools/capture"]
# A root `cargo build`/`cargo test` means the product, not its dev tools.
# The tools stay members, so they share the lockfile and build on request.
default-members = ["."]

# The shared policy for packages that opt in with `[lints] workspace = true`.
# Deliberately small: a lint joins this table only when a real class of bug
# motivates it. Warnings stay warnings; CI decides whether to deny them.
# The two dev tools set a smaller subset of their own; see their manifests.
[workspace.lints.rust]
# The product has no `unsafe`; the allocator instrument in `tests/peak_heap.rs`
# is the one deliberate exception and says so itself.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
# A panic in the repair path is a failed run, not a diagnostic. Existing
# `expect`s carry a message; the warning keeps new ones deliberate.
unwrap_used = "warn"
expect_used = "warn"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
# The log-file and log-level policy, shared with the two dev tools so that
# `--log-file`, the env vars and the default levels mean the same thing in
# all three.
girpr-log = { path = "crates/log" }
# The runtime, its macros (`join!`) and the timers the pipeline awaits. This
# list is the crate's own request; `reqwest` enables tokio's network surface in
# every build anyway, so the real saving is what this list does *not* ask for:
# `process` and `signal`. `process` is needed only by the CLI tests, which run
# the built binary, so it stays a dev-only feature below; `test-util` is
# dev-only for the same reason. A normal build compiles neither.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
md-5 = "0.10"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
walkdir = "2"
glob = "0.3"
# Only the `Stream`/`StreamExt` traits and `stream::iter` are used, never the
# `join!`/`select!`-style macros, so the default `async-await-macro` feature
# (and its `futures-macro` proc-macro) is not compiled. `std` is still needed:
# it carries the `StreamExt` combinators, and it pulls `slab` along with it.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# The scratch-directory helper, shared with the two dev tools: one name, one
# construction and one cleanup for every test in the workspace. A
# dev-dependency, because nothing that ships creates a scratch directory.
girpr-tempdir = { path = "crates/tempdir" }
# Test-only features; Cargo unions these with the normal features for a test
# build, so `cargo build` still compiles just the runtime.
# `test-util`: paused-time tests check the progress guard's cadence and its
# stop-on-drop against a controlled clock rather than by sleeping in CI.
# `process`: the CLI tests run the built binary.
# `net` and `io-util`: the fake artifact servers accept connections and read
# requests. (`reqwest` already enables `net` in a normal build; naming it here
# keeps the tests' own requirement explicit.)
tokio = { version = "1", features = ["test-util", "process", "net", "io-util"] }

# The shipped artifact is a single CLI binary, so trade build time for a
# smaller, slightly faster one: thin LTO and one codegen unit, and no debug
# info. Unwinding stays enabled so that `Drop`-based cleanup of locks and
# temporary files still runs on a panic.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
