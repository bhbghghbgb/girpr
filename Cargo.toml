[package]
name = "girpr"
version = "0.1.0"
edition = "2024"
description = "Genshin Impact low-disk repair patcher (Starward chunk-repair core + Collapse extra purge)"

[[bin]]
name = "girpr"
path = "src/main.rs"

[workspace]
members = [".", "crates/log", "crates/tempdir", "tools/sync", "tools/capture"]
# A root `cargo build`/`cargo test` means the product, not its dev tools.
# The tools stay members, so they share the lockfile and build on request.
default-members = ["."]

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
# The log-file and log-level policy, shared with the two dev tools so that
# `--log-file`, the env vars and the default levels mean the same thing in
# all three.
girpr-log = { path = "crates/log" }
# The runtime, its macros (`join!`) and the timers the pipeline awaits. The
# network and I/O surfaces used by the tests are requested as dev-only features
# below, so a normal build does not compile them.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
md5 = "0.7"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
walkdir = "2"
glob = "0.3"
futures-core = "0.3"
futures-util = "0.3"

[dev-dependencies]
# The scratch-directory helper, shared with the two dev tools: one name, one
# construction and one cleanup for every test in the workspace. A
# dev-dependency, because nothing that ships creates a scratch directory.
girpr-tempdir = { path = "crates/tempdir" }
# Test-only additions to the runtime above; Cargo unions these with the normal
# features for a test build, so `cargo build` still compiles just the runtime.
# `test-util`: paused-time tests check the progress guard's cadence and its
# stop-on-drop against a controlled clock rather than by sleeping in CI.
# `process`: the CLI tests run the built binary.
# `net` and `io-util`: the fake artifact servers accept connections and read
# requests.
tokio = { version = "1", features = ["test-util", "process", "net", "io-util"] }
