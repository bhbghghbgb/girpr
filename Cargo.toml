[package]
name = "girpr"
version = "0.1.0"
edition = "2021"
description = "Genshin Impact low-disk repair patcher (Starward chunk-repair core + Collapse extra purge)"

[[bin]]
name = "girpr"
path = "src/main.rs"

[workspace]
members = [".", "tools/sync"]

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
md5 = "0.7"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
walkdir = "2"
regex = "1"
futures = "0.3"
