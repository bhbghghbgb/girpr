[package]
name = "girpr"
version = "0.1.0"
edition = "2024"
# Integration tests are declared explicitly below. One root per group shares
# a single `common` module and one link of the workspace tree; auto-discovery
# would bring back a separate binary for every file under `tests/`.
autotests = false
# The workspace standardizes on the stable Rust toolchain (see
# `rust-toolchain.toml` at the repository root). There is deliberately no
# `rust-version` floor: edition 2024 and the stable compiler are the only
# requirement, so newer language features and library versions are never
# blocked by an old minimum.
description = "GI low-disk repair patcher (Starward chunk-repair core + Collapse extra purge)"

[[bin]]
name = "girpr"
path = "src/main.rs"

# Four integration roots replace the fourteen auto-discovered files. The two
# bridge/post roots stay separate because their cases are named by nextest
# overrides (host-dependent skips whose lines must stay visible); grouping
# those would move their fully-qualified paths out from under pinned filters.
[[test]]
name = "artifact_bridge"
path = "tests/artifact_bridge.rs"

[[test]]
name = "repair_post"
path = "tests/repair_post.rs"

[[test]]
name = "repair"
path = "tests/repair.rs"

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[workspace]
members = [".", "app/audio", "crates/audio-language", "crates/chunk-cost", "crates/chunk-identity", "crates/chunk-verify", "crates/cli", "crates/digest", "crates/exit", "crates/fetch", "crates/filter", "crates/fs-identity", "crates/fs-names", "crates/lock", "crates/log", "crates/loopback-mock", "crates/model", "crates/path-shape", "crates/proto", "crates/report", "crates/report-core", "crates/repair-plan", "app/repair-policy", "crates/retry", "crates/tempdir", "crates/test-fixtures", "crates/test-support", "crates/time", "app/util-counter", "app/util-hash", "app/util-ini", "app/util-path", "crates/value-ranges", "tools/sync", "tools/sync/cache", "tools/sync/leaves", "tools/sync/test-support", "tools/capture", "tools/capture/hash", "tools/capture/http", "tools/capture/test-support", "tools/sled2redb"]
# A root `cargo build`/`cargo test` means the product, not its dev tools.
# The tools stay members, so they share the lockfile and build on request.
default-members = ["."]

# The shared policy for packages that opt in with `[lints] workspace = true`.
# Deliberately small: a lint joins this table only when a real class of bug
# motivates it. Warnings stay warnings; CI decides whether to deny them.
# The two dev tools set a smaller subset of their own; see their manifests.
[workspace.lints.rust]
# The product and its tests have no `unsafe`.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
# A panic in the repair path is a failed run, not a diagnostic. Existing
# `expect`s carry a message; the warning keeps new ones deliberate.
unwrap_used = "warn"
expect_used = "warn"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
# The log-file and log-level policy, shared with the two dev tools so that
# `--log-file`, the env vars and the default levels mean the same thing in
# all three.
girpr-log = { path = "crates/log" }
# The shared lower + `_`→`-` audio-token primitive and the four code/display-name
# pairs, used by this binary's CLI and scan-file writer. The capture tool borrows
# the same mechanics but keeps its own trim, alias map, sentinel and validation.
girpr-audio-language = { path = "crates/audio-language" }
# The audio scan-file read/write and effective-selection boundary. It lives in
# its own acyclic leaf crate so an edit to the repair, report or CLI modules
# leaves the whole audio boundary cached; this binary depends on it directly
# under a module alias, and narrow consumers link it without this facade.
girpr-audio = { path = "app/audio" }
# The run counters, the record data plane, every stdout line and the phase
# timer. They live in their own crate so an edit to the repair modules below
# leaves the whole report plane cached. This binary consumes the crate directly
# under module aliases; the begin report borrows scalar provenance values, so
# no fetch DTO leaks into it. The ordered-JSON leaf is reused inside it. `clap`
# is enabled because this binary defines `--output` with `OutputFormat` as its
# value type; other report consumers do not pull in the CLI framework.
girpr-report = { path = "crates/report", features = ["clap"] }
# The exit-table generation mechanism, shared with the capture tool. The leaf
# owns only the enum/`ALL`/code/pin pattern; this binary supplies its own codes,
# meanings and helper methods, so no exit-code value is shared.
girpr-exit = { path = "crates/exit" }
# The clap-error to usage-code mapping mechanics, shared with the two dev
# tools. The leaf only decides "help/version -> 0, otherwise the supplied
# usage code"; this binary keeps its own `RunExit` process-status boundary.
girpr-cli = { path = "crates/cli" }
# Pure inclusive-range facts for the numeric flags this binary and the two dev
# tools validate. The leaf answers only "below min / above max / in range" and
# carries the offending value; this binary keeps its `bail!` wording and its
# process-status boundary, and the tools keep theirs.
girpr-value-ranges = { path = "crates/value-ranges" }
# The runtime, its macros (`join!`) and the timers the pipeline awaits. This
# list is the crate's own request; `reqwest` enables tokio's network surface in
# every build anyway, so the real saving is what this list does *not* ask for:
# `process` and `signal`. `process` is needed only by the CLI tests, which run
# the built binary, so it stays a dev-only feature below; `test-util` is
# dev-only for the same reason. A normal build compiles neither.
# `default-features = false` withholds nothing on its own: tokio's `default`
# set is empty. `reqwest`'s tree enables it anyway, so the resolved graph still
# lists `default`, but it adds no feature or crate.
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The shared Sophon wire types: one set of protobuf tags, misspelled `chuncks`
# and opaque tag 6 as both programs decode them. The leaf owns only the byte
# layout; this binary keeps its own wrapper and validation around it.
girpr-proto = { path = "crates/proto" }
# The shared saturating download-projection fold. The `PLAN` total, the
# `SUMMARY plan_download_bytes` key and the artifact ranking key are one figure
# shared with gircap, so the arithmetic lives in one logic-free leaf. This
# binary supplies its own chunk selection through the per-entry flag; the leaf
# holds no reuse decision, collision handling or published-byte shape.
girpr-chunk-cost = { path = "crates/chunk-cost" }
# The chunk-verification leaf: the verdict a scan produces, the range/owner
# remap shared by the scan and the in-place writer, and the verify pass that
# re-derives the finished file from a fresh read. It depends only on the wire
# chunk and hash/scan leaves, so the correctness-sensitive guard stays in the
# facade while the mechanics compile and test in a narrow target.
girpr-chunk-verify = { path = "crates/chunk-verify" }
# The write-mode values and the one resolve rule. They live in an acyclic leaf
# so the writer, the disk estimate and the download estimate all consume the
# same decision directly, and neither `file` nor `scan` owns it. `clap` is
# enabled because this binary exposes `--repair-mode` as the enum's value type.
girpr-repair-policy = { path = "app/repair-policy", features = ["clap"] }
# The repair-plan values and the pure decisions over them: the work list, the
# cleanup-plan values, the path scope, and the download/summary figures. They
# live in one acyclic leaf so the scope tier can consume both plans without the
# plan modules pointing back at the facade. This binary keeps the fetch, walk,
# publish and byte-emitting policies and consumes the values directly.
girpr-repair-plan = { path = "crates/repair-plan" }
# The shared region identity, ids and base URLs. The leaf holds only values;
# this binary keeps its `Biz` resolve/request policy at its own call sites.
# `clap` is enabled because `Biz` is this binary's `--biz` flag type.
girpr-model = { path = "crates/model", features = ["clap"] }
# Hex spelling and fixed-width digest mechanics, shared with the two dev tools
# that cross the same digest/text boundary. A leaf crate with no program logic.
girpr-digest = { path = "crates/digest" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# The file layer's writer: a non-blocking queue drained by a worker thread, so
# logging never blocks the run and the worker guard flushes the tail on exit.
tracing-appender = "0.2.5"
anyhow = "1.0.104"
# The retry schedule factory and the injectable sleep driver. The leaf owns
# `backoff` and the ±50 % jitter is this program's choice, passed in as a
# parameter, so its retry waits stay exactly as before.
girpr-retry = { path = "crates/retry" }
walkdir = "2.5.1"
# The shared --include/--exclude glob rules, used by this crate's repair scope
# and by girsync. One glob version and one set of matching rules for both.
girpr-filter = { path = "crates/filter" }
# The shared Windows device-name predicate mechanism, used here with girpr's
# exact rule (reserved set includes CLOCK$, trailing dot/space trimmed). The
# capture tool borrows the same mechanism with its own rule parameters.
girpr-fs-names = { path = "crates/fs-names" }
# The link-count and file-identity facts read by the single-writer lock. The
# leaf owns the platform wrappers and the error/option shapes; the guard here
# keeps its own fail-closed policy and its no-follow path check.
girpr-fs-identity = { path = "crates/fs-identity" }
# The single-writer run lock. It lives in its own crate so a repair-phase edit
# leaves it cached, and a lock-only integration test can depend on the lock
# directly instead of linking this whole facade. The lock policy and its FNV
# key are unchanged; the leaf owns only the file/identity mechanics it reads.
girpr-lock = { path = "crates/lock" }
# The HYP/Sophon fetch path and the DTOs it decodes. They live in their own
# crate so an edit to the repair, report or CLI modules below leaves the whole
# reqwest/zstd/prost tree cached. This binary (and the tests that link it)
# depends on the crate directly; the attempt loop and the test HTTP seam kept
# with it stay local to the fetch side.
girpr-fetch = { path = "crates/fetch" }
# The low-level path/atomic, hash/scan and ini mechanics. They live in narrow
# leaf crates so an edit to one leaves the others (and the consumers that use
# only those others) cached; this binary depends on each one directly. The
# `test-support` features are enabled only by the dev-dependencies below, so the
# unit-test-only fixtures and scan helpers stay out of shipped builds.
girpr-util-path = { path = "app/util-path" }
girpr-util-hash = { path = "app/util-hash" }
girpr-util-ini = { path = "app/util-ini" }
# Only the `Stream`/`StreamExt` traits and `stream::iter` are used, never the
# `join!`/`select!`-style macros, so the default `async-await-macro` feature
# (and its `futures-macro` proc-macro) is not compiled. `std` is still needed:
# it carries the `StreamExt` combinators, and it pulls `slab` along with it.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Atomic publish for the clean artifacts (config, scan, plan, and the audio
# copy fallback): a temp file in the target's directory whose `persist()` is an
# atomic rename (MoveFileEx + MOVEFILE_REPLACE_EXISTING on Windows). The resume
# `_tmp` files are deliberately not built on this - see the file writer.
tempfile = "3.27"

[dev-dependencies]
# The shared offline HYP/Sophon mock, fixture builders and lock-cleanup
# helpers for the root integration binaries. They used to be inlined by
# `mod common;` into every binary; the public library surface lets each binary
# keep a thin shim and compiles the mechanics once. This crate is facade-free,
# so a product edit leaves it cached.
girpr-test-fixtures = { path = "crates/test-fixtures" }
# The small facade-coupled run glue (RunCtx construction, the pipeline driver,
# the counter reader) that used to be inlined by every integration binary. It
# depends on this package, so this is a test-only inversion; the mechanics it
# composes with stay in the facade-free crate above.
girpr-test-support = { path = "crates/test-support" }
# The one shared log-capture helper, used by both unit and integration tests.
# The test-support features are off in the shipped build; nextest runs one
# process per test and skips doctests, so the helper must be a public library
# surface that every test binary can reach through a thin shim. The repair
# metadata tests capture across an `.await`, so this consumer enables the async
# surface (which implies the synchronous one); sync-only consumers enable just
# `test-support` and never compile tokio.
girpr-log = { path = "crates/log", features = ["test-support-async"] }
# The facade's unit tests build `FileReuse` values by hand and need the
# `ReuseEntry` alias. The feature is off in the normal dependency above, so only
# test builds see the extra alias on girpr-fetch's public surface.
girpr-fetch = { path = "crates/fetch", features = ["test-support"] }
# The scratch-directory helper, shared with the two dev tools: one name, one
# construction and one cleanup for every test in the workspace. A
# dev-dependency, because nothing that ships creates a scratch directory.
girpr-tempdir = { path = "crates/tempdir" }
# The junction/symlink fixture helpers and the slice-digest helpers the repair
# tests share with the narrow crates' own unit tests. The features are off in
# the normal dependencies above.
girpr-util-path = { path = "app/util-path", features = ["test-support"] }
girpr-util-hash = { path = "app/util-hash", features = ["test-support"] }
# Test-only features; Cargo unions these with the normal features for a test
# build, so `cargo build` still compiles just the runtime.
# `process`: the CLI tests run the built binary.
# `net` and `io-util`: the fake artifact servers accept connections and read
# requests. (`reqwest` already enables `net` in a normal build; naming it here
# keeps the tests' own requirement explicit.) `default-features = false` mirrors
# the normal dependency above; tokio's `default` set is empty, so this withholds
# no test feature. Paused-time tests live in `girpr-report`, which declares its
# own `test-util` dev feature; root tests never pause the clock.
tokio = { version = "1.54.1", default-features = false, features = ["process", "net", "io-util"] }
# The dependency-free loopback server behind the canned-reply unit tests. The
# local helper keeps this product's own body-scripting contract; the fetch and
# capture tests script the same leaf with their own replies and assertions.
girpr-loopback-mock = { path = "crates/loopback-mock" }
# The artifact-server fixture tests build zstd frames for their replay bodies;
# the production paths do their prost/zstd work in `girpr-fetch`. The root's
# canned manifest bodies are frozen bytes in manifest.rs, so this crate needs
# no direct prost dependency.
zstd = "0.14.4"

# Debug/test builds are link-bound on low-core HDD hosts: the default of 256
# codegen units produces hundreds of object files per crate for the linker to
# open and relocate. Four units match a 4-core host. The test profile below
# overrides this with a single unit, which measured even faster for its many
# small test binaries.
[profile.dev]
codegen-units = 4

# A workspace test run links dozens of binaries, each with the whole
# dependency tree. With MSVC full debug info that means a 100-190 MB PDB per
# binary; dropping it for tests cut the measured link time several-fold.
# `dev` keeps full debug info for debugging the product binary; `release` is
# unchanged.
[profile.test]
debug = 0
codegen-units = 1
# One codegen unit gives up intra-crate codegen parallelism, but leaves one
# object file per crate for the linker to open and relocate. Cargo's job
# parallelism across crates is the useful parallelism on a 4-core host.
# The incremental cache is also a net loss on an HDD: ~140k tiny files must be
# reloaded and rewritten for every test binary, costing more than a full
# recompile, and it makes target/ grow on every edit.
incremental = false

# The shipped artifact is a single CLI binary, so trade build time for a
# smaller, slightly faster one: thin LTO and one codegen unit, and no debug
# info. Unwinding stays enabled so that `Drop`-based cleanup of locks and
# temporary files still runs on a panic.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
