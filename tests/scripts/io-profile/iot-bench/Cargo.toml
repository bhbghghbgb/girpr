[package]
name = "iot-bench"
version = "0.1.0"
edition = "2021"
description = "Microbenchmarks of the file-system operations the test suite performs"

[dependencies]
# Track the same redb line the workspace cache uses (`tools/sync`). No exact
# pin: the old one only held an MSRV floor that no longer applies, so newer
# 4.x releases are allowed as the dependency-upgrade work moves the lockfile.
redb = "4"

[profile.release]
opt-level = 2

# Standalone: this tool is not a member of the workspace at the repository
# root, so builds do not pull it into `cargo test --workspace`.
[workspace]
