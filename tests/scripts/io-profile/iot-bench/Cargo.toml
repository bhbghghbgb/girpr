[package]
name = "iot-bench"
version = "0.1.0"
edition = "2021"
description = "Microbenchmarks of the file-system operations the test suite performs"

[dependencies]
# Track the same redb pin the workspace cache uses (`tools/sync`): 4.2.0 is
# the newest release before the 4.3+ cache-lock behaviour change.
redb = "=4.2.0"

[profile.release]
opt-level = 2

# Standalone: this tool is not a member of the workspace at the repository
# root, so builds do not pull it into `cargo test --workspace`.
[workspace]
