# The workspace's test runner.
#
# Every crate here runs its tests with `cargo nextest run`: `girpr`,
# `girpr-log`, `girpr-tempdir`, `gircap` and `girsync`. This file is where the
# runner's defaults live, so the behaviour is the same whoever typed the
# command and whichever crate the command names.
#
# `cargo nextest` needs the `cargo-nextest` binary:
#
#     cargo install cargo-nextest --locked
#
# (or the prebuilt release for the platform, from
# <https://github.com/nextest-rs/nextest/releases>).
#
# What this file cannot do is run **doctests**: nextest does not support them.
# The workspace's doctests — the examples in `crates/log/src/lib.rs` and
# `crates/tempdir/src/lib.rs` — are therefore mirrored by unit tests beside
# them, so `cargo nextest run` on its own still covers everything the suite
# covers.

# Setup scripts are how a test-only environment variable reaches every test
# process (and the processes they spawn). Nextest has no profile-level `env`
# table: `env` is a field of a script's `command`, and the only documented way
# to export a variable *to tests* is a setup script writing it to
# `$NEXTEST_ENV`.
experimental = ["setup-scripts"]

# Test-only hooks, all default-off in production:
#
# * `GIRSYNC_TEST_DURABILITY=none` — cache write transactions skip their
#   per-commit fsync. Production always commits with `Durability::Immediate`
#   (see `tools/sync/src/cache/mod.rs::write_durability`); redb still flushes on
#   a clean `Database` drop, so a test that reopens the cache file sees every
#   row.
# * `GIRSYNC_TEST_NO_FSYNC=1` — `copy_one` skips its per-file `sync_all` after
#   writing (see `tools/sync/src/commands/sync/apply.rs::test_no_fsync`). The
#   bytes, size/mtime checks and cache records are unchanged.
# * `GIRPR_TEST_NO_FSYNC=1` — `write_config_ini` skips its `sync_all` before the
#   rename (see `src/util.rs::test_no_fsync`). The temp-file write and rename
#   are unchanged.
#
# Production defaults to durable: an unset variable (or a non-truthy value)
# leaves every flush in place. These are deliberately not `cfg(test)`: the
# slowest suites spawn the real binaries, and child processes inherit the
# variables.
#
# The hooks are listed in exactly one place, `.config/nextest-test-env`, and the
# setup commands below only copy that file to `$NEXTEST_ENV`. Adding a hook
# means editing the env file, not the commands. `.gitattributes` pins the file
# to LF: a CRLF checkout would leave a trailing `\r` in every value, and
# `GIRSYNC_TEST_DURABILITY` would not equal `"none"`.
#
# One script per platform. The Windows script uses `cmd.exe` instead of
# PowerShell, whose startup alone cost ~1.7 s on every `cargo nextest run`.
# nextest passes arguments through Rust's `Command`, which escapes an embedded
# `"` as `\"`; cmd.exe reads that backslash literally and fails, so the quoted
# paths live in a two-line `.cmd` wrapper (`type` plus `>> "%NEXTEST_ENV%"`)
# rather than in this command line. Both scripts run on every
# `cargo nextest run`, whichever crate the command names; nextest runs setup
# scripts with the workspace root as their working directory.
[scripts.setup.test-hooks-unix]
command = [
    'sh',
    '-c',
    'cat .config/nextest-test-env >> "$NEXTEST_ENV"',
]

[scripts.setup.test-hooks-windows]
command = ['cmd', '/D', '/Q', '/C', '.config\\nextest-test-env.cmd']

[[profile.default.scripts]]
filter = 'all()'
platform = { host = "cfg(unix)" }
setup = 'test-hooks-unix'

[[profile.default.scripts]]
filter = 'all()'
platform = { host = "cfg(windows)" }
setup = 'test-hooks-windows'

[profile.default]
# Every failure is reported at the end, with the output it captured, rather
# than the first one scrolling the rest of the list away.
failure-output = "final"

# A test that has said nothing for a minute is marked slow. Nothing is killed:
# the bundle-backed suites are legitimately slow, and a killed test is a false
# alarm dressed up as a hang.
slow-timeout = { period = "60s" }

# These cases report a host-dependent skip on stderr and then pass. Nextest's
# default profile discards a passing test's captured output, so the skip would
# be invisible under the plain gate; show it for these tests only.
#
# The filter names the binary as well as the cases, for the same reason the
# filters below do: a `test(=name)` predicate on its own matches the same name
# in *any* binary, so a test elsewhere that happened to share one of these
# names would silently inherit the override. `package(=girpr)` and
# `binary(=repair_post)` pin the two cases to the integration test they live in.
[[profile.default.overrides]]
filter = """
    package(=girpr)
    and binary(=repair_post)
    and (
        test(=a_non_utf8_audio_cache_name_moves_byte_for_byte)
        or test(=a_non_utf8_audio_cache_name_moves_through_the_binary)
    )
"""
success-output = "immediate"

# The junction cases report a host-dependent skip on stderr and then pass, so
# their skip line must be visible under the plain gate too.
#
# The filter names the binary as well as the cases, for the same reason the
# bridge filter below does: a `test(=name)` predicate on its own matches the
# same name in *any* binary, so a test elsewhere that happened to share one of
# these names would silently inherit the override. `package(=girpr)` and
# `binary(=girpr)` pin the two cases to the library's own test binary.
[[profile.default.overrides]]
filter = """
    package(=girpr)
    and binary(=girpr)
    and (
        test(=util::ini::tests::config_bump_refuses_a_dangling_junction_game_dir)
        or test(=util::path::tests::contained_join_resolves_a_junction_and_refuses_the_escape)
    )
"""
success-output = "immediate"

# The dangling-symlink case reports a host-dependent skip on stderr and then
# passes, so its skip line must be visible under the plain gate too: it names
# the switch that turns that skip into a failure.
[[profile.default.overrides]]
filter = """
    package(=girpr)
    and binary(=girpr)
    and test(=util::ini::tests::config_bump_refuses_a_dangling_symlink_game_dir)
"""
success-output = "immediate"

# The Unix symlink cases report the same host-dependent skip on stderr and then
# pass, so their skip lines must be visible under the plain gate too. A host
# that refuses a symlink cannot run them, and a silent pass would read as
# coverage the run never had.
#
# The filter names the binary as well as the cases, for the same reason the
# filters above do.
[[profile.default.overrides]]
filter = """
    package(=girpr)
    and binary(=girpr)
    and (
        test(=util::path::tests::contained_join_resolves_a_symlink_and_refuses_the_escape)
        or test(=repair::scope::report::tests::publishing_over_a_symlink_replaces_the_link_not_its_target)
        or test(=repair::file::tests::a_symlink_resolves_to_the_temp_mode)
        or test(=repair::lock::tests::a_preexisting_symlink_target_is_not_truncated)
        or test(=repair::lock::tests::a_path_swapped_after_open_is_not_written_through_the_old_handle)
    )
"""
success-output = "immediate"

# The clock fixtures that need a moment before the Unix epoch report a
# host-dependent skip on stderr and then pass, so their skip line must be
# visible under the plain gate too: it names the switch that turns that skip
# into a failure.
#
# The filter names the binary as well as the cases, for the same reason the
# filters above do.
[[profile.default.overrides]]
filter = """
    package(=girpr)
    and binary(=girpr)
    and (
        test(=test_support::tests::an_ago_stamp_keeps_its_age_on_either_side_of_the_epoch_and_across_it_backward)
        or test(=repair::file::inplace::tests::a_stale_damaged_verdict_never_makes_the_writer_skip)
        or test(=repair::file::inplace::tests::the_guard_rejects_a_verdict_that_does_not_describe_the_file)
        or test(=repair::file::inplace::tests::the_guard_reuses_only_an_unchanged_plan_scan)
        or test(=repair::file::inplace::tests::the_reuse_age_rule_requires_more_than_one_coarse_tick)
    )
"""
success-output = "immediate"

# The bridge cases are `#[ignore]`d and run by hand, and `gircap` is an
# optional sibling binary. When it is not built, `assert_bundle_verifies`
# prints the same kind of host-dependent skip and the case still passes. Nextest
# discards a passing test's captured output by default, so show it for this
# filter: that is what lets the hand-run command in `tests/artifact_bridge.rs`
# leave `--no-capture` off.
#
# The filter names the binary as well as the cases. A `test(=name)` predicate
# on its own matches the same name in *any* binary, so a test elsewhere that
# happened to share one of these names would silently inherit the override.
# `package(=girpr) and binary(=artifact_bridge)` pins the six cases to the
# integration test they live in.
[[profile.default.overrides]]
filter = """
    package(=girpr)
    and binary(=artifact_bridge)
    and (
        test(=the_identical_capture_fetches_nothing)
        or test(=the_no_reuse_capture_fetches_the_whole_file)
        or test(=the_reuse_in_place_capture_fetches_only_what_it_must)
        or test(=the_reuse_moved_capture_fetches_only_what_it_must)
        or test(=the_added_capture_writes_the_new_file)
        or test(=the_removed_capture_purges_the_file)
    )
"""
success-output = "immediate"
