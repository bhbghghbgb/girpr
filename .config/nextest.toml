# The workspace's test runner.
#
# Every crate here runs its tests with `cargo nextest run`: `girpr`,
# `girpr-log`, `girpr-tempdir`, `gircap` and `girsync`. This file is where the
# runner's defaults live, so the behaviour is the same whoever typed the
# command and whichever crate the command names.
#
# `cargo nextest` needs the `cargo-nextest` binary:
#
#     cargo install cargo-nextest --locked
#
# (or the prebuilt release for the platform, from
# <https://github.com/nextest-rs/nextest/releases>).
#
# What this file cannot do is run **doctests**: nextest does not support them.
# The workspace's doctests — the examples in `crates/log/src/lib.rs` and
# `crates/tempdir/src/lib.rs` — are therefore mirrored by unit tests beside
# them, so `cargo nextest run` on its own still covers everything the suite
# covers.

# Setup scripts are how a test-only environment variable reaches every test
# process (and the processes they spawn). Nextest has no profile-level `env`
# table: `env` is a field of a script's `command`, and the only documented way
# to export a variable *to tests* is a setup script writing it to
# `$NEXTEST_ENV`.
experimental = ["setup-scripts"]

# Test-only hooks, all default-off in production:
#
# * `GIRSYNC_TEST_DURABILITY=none` — cache write transactions skip their
#   per-commit fsync. Production always commits with `Durability::Immediate`
#   (see `tools/sync/src/cache/mod.rs::write_durability`); redb still flushes on
#   a clean `Database` drop, so a test that reopens the cache file sees every
#   row.
# * `GIRSYNC_TEST_NO_FSYNC=1` — `copy_one` skips its per-file `sync_all` after
#   writing (see `tools/sync/src/commands/sync/apply.rs::test_no_fsync`). The
#   bytes, size/mtime checks and cache records are unchanged.
# * `GIRPR_TEST_NO_FSYNC=1` — `write_config_ini` skips its `sync_all` before the
#   rename (see `src/util.rs::test_no_fsync`). The temp-file write and rename
#   are unchanged.
#
# Production defaults to durable: an unset variable (or a non-truthy value)
# leaves every flush in place. These are deliberately not `cfg(test)`: the
# slowest suites spawn the real binaries, and child processes inherit the
# variables.
#
# One script per platform, because Windows needs PowerShell to append to a path
# that may contain spaces, while the Unix shell can do it directly. Both run on
# every `cargo nextest run`, whichever crate the command names.
[scripts.setup.test-hooks-unix]
command = [
    'sh',
    '-c',
    'printf "%s\n" GIRSYNC_TEST_DURABILITY=none GIRSYNC_TEST_NO_FSYNC=1 GIRPR_TEST_NO_FSYNC=1 >> "$NEXTEST_ENV"',
]

[scripts.setup.test-hooks-windows]
command = [
    'powershell',
    '-NoProfile',
    '-NonInteractive',
    '-Command',
    '$ErrorActionPreference = "Stop"; Add-Content -LiteralPath $env:NEXTEST_ENV -Value @("GIRSYNC_TEST_DURABILITY=none", "GIRSYNC_TEST_NO_FSYNC=1", "GIRPR_TEST_NO_FSYNC=1")',
]

[[profile.default.scripts]]
filter = 'all()'
platform = { host = "cfg(unix)" }
setup = 'test-hooks-unix'

[[profile.default.scripts]]
filter = 'all()'
platform = { host = "cfg(windows)" }
setup = 'test-hooks-windows'

[profile.default]
# Every failure is reported at the end, with the output it captured, rather
# than the first one scrolling the rest of the list away.
failure-output = "final"

# A test that has said nothing for a minute is marked slow. Nothing is killed:
# the bundle-backed suites are legitimately slow, and a killed test is a false
# alarm dressed up as a hang.
slow-timeout = { period = "60s" }
