[package]
name = "girpr-request-url"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The shared HYP/Sophon query grammar and CDN path-append mechanics"

[lib]
name = "girpr_request_url"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The exact byte table both programs send verbatim. This leaf owns the grammar
# mechanics; the table stays in the value leaf so no program can re-spell it.
girpr-model = { path = "../model" }
percent-encoding = "2.3.2"
# Only `Url`'s path-segment API and its re-exported form decoder are borrowed.
# Query rewriting stays string-based: a `Url` query serializer would escape the
# literal `game_ids[]` key and change recorded request bytes.
url = "2.5.9"
