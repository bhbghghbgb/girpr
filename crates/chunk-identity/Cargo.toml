[package]
name = "girpr-chunk-identity"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "The shared chunk-identity value types and borrowed view (hex normalisation re-exported)"

[lib]
name = "girpr_chunk_identity"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The digest-byte key and the case-insensitive hex parse rule live here, and
# the hex normalisation helper is re-exported from the same leaf; the wire type
# the borrowed view reads comes from the logic-free proto leaf.
girpr-digest = { path = "../digest" }
girpr-proto = { path = "../proto" }
