[package]
name = "girpr-fs-identity"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "The shared file-identity and link-count facts the girpr workspace reads platform-by-platform"

[lib]
name = "girpr_fs_identity"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Identity is a handle-backed `dev`/`ino` or volume-serial/file-index pair that
# stays exact after the file's name is taken away — the property the cache's
# publish claim relies on. `same-file` owns the platform wrapper, so this leaf
# writes no FFI and needs no `unsafe_code` exception.
same-file = { workspace = true }

[dev-dependencies]
# Test scratch directories get a random name and cleanup in Drop from tempfile;
# this leaf still depends on nothing but the identity facts it tests.
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
# std does not expose a file's link count or stable identity on Windows
# (`windows_by_handle` is still unstable). This safe wrapper owns the
# `GetFileInformationByHandle` call and the directory/reparse-point opens.
winapi-util = { workspace = true }
