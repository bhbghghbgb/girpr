[package]
name = "girpr-chunk-layout"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "Half-open byte ranges and the shared chunk-tiling cursor, with typed problems for callers to diagnose"

[lib]
name = "girpr_chunk_layout"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
girpr-chunk-cost = { path = "../chunk-cost" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
