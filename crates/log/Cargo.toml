[package]
name = "girpr-log"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The log-file and log-level policy every project in the girpr workspace follows"

[lib]
name = "girpr_log"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# For the timestamp in a default log file name and in a caller-supplied instant
# (a capture id or a manifest id).
chrono = { version = "0.4.45", features = ["clock"] }
# For building the console's filter from `--log-level` or `RUST_LOG`, for the
# one place a broken spec is turned into a warning, and for the `info!` that
# announces where the log file went.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# For the non-blocking file writer shared by the three installations. The
# guard it returns is stored by each project, not by this crate.
tracing-appender = "0.2.5"
