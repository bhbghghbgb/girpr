[package]
name = "girpr-log"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The log-file and log-level policy every project in the girpr workspace follows"

[lib]
name = "girpr_log"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The `test_support` module holds the shared `logs_of` implementation and its
# JSON-formatted counterpart. It is a dev/test surface only: no shipped program
# links against it, and each consumer opts in through a dev-dependency. The
# synchronous helpers need no runtime at all; only the async variants read the
# current runtime's flavor.
#
# The JSON capture surface is where `serde_json` and `tracing-subscriber`'s
# `json` formatter are pulled in. Both stay out of shipped builds: they are
# activated by this feature alone, which every consumer enables only as a
# dev-dependency.
test-support = ["dep:serde_json", "tracing-subscriber/json"]
# `logs_of_async` / `logs_of_async_json` and their always-on current-thread
# runtime assertion are optional on top of the sync surface. Consumers that
# only capture synchronous logs enable `test-support` alone and never compile
# tokio; the callers that capture across an `.await` enable this feature instead.
test-support-async = ["test-support", "dep:tokio"]

[dev-dependencies]
# The runtime-flavor guard's regression test builds a multi-thread runtime;
# the shipped helper itself only needs `rt` to read the flavor.
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros"] }
# Only the install tests scratch a directory; tempfile supplies the random name
# and removes the tree when the guard drops.
tempfile = "3.27.0"

[dependencies]
# The one compact stamp in a default log file name. The format lives in the
# time leaf; this crate only asks it to stamp "now".
girpr-time = { path = "../time" }
# Owns the five filter spellings and their declaration-order iteration; the
# wrapper `parse` keeps the `warning` alias and the custom error text. No serde.
strum = { version = "0.28.0", features = ["derive"] }
# For building the console's filter from `--log-level` or `RUST_LOG`, for the
# one place a broken spec is turned into a warning, and for the `info!` that
# announces where the log file went.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# For the non-blocking file writer shared by the three installations. The
# guard it returns is stored by each project, not by this crate.
tracing-appender = "0.2.5"
# Only the JSON capture surface parses `serde_json::Value`s. Optional so
# shipped builds of this policy crate stay dependency-free; no feature that
# changes `Value` key ordering is enabled.
serde_json = { version = "1.0.154", optional = true }
# Only the async test helpers read the current runtime's flavor. Optional so
# shipped builds of this policy crate stay dependency-free.
tokio = { version = "1.54.1", default-features = false, features = ["rt"], optional = true }
