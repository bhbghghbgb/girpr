[package]
name = "girpr-model"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The shared region identity, ids and base-URL values both programs use verbatim"

[lib]
name = "girpr_model"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The clap `ValueEnum` derive is opt-in. A consumer that only needs the values
# (region strings, ids, bases) does not pull clap into its graph; two programs
# that expose the regions as a CLI flag enable this feature.
clap = ["dep:clap"]

[dependencies]
clap = { version = "4.6.9", features = ["derive"], optional = true }
