[package]
name = "girpr-model"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "The shared region identity, ids, base URLs and query-value byte table both programs use verbatim"

[lib]
name = "girpr_model"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The clap `ValueEnum` derive is opt-in. A consumer that only needs the values
# (region strings, ids, bases) does not pull clap into its graph; two programs
# that expose the regions as a CLI flag enable this feature.
clap = ["dep:clap"]

[dependencies]
clap = { workspace = true, features = ["derive"], optional = true }
# Owns the region id spellings once: `Display`, iteration and the const
# `as_str` seam all come from the same `serialize` attributes. No serde.
strum = { workspace = true, features = ["derive"] }
# Owns the exact byte table that spells HYP/Sophon query values. Both programs
# already depend on this locked crate directly; holding the table in this value
# leaf keeps their request URLs from drifting apart.
percent-encoding = { workspace = true }
