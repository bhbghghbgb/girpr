[package]
name = "girpr-report-core"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "The shared ordered record container, JSON writer, emit sink and output-format mechanics used by the three report planes"

[lib]
name = "girpr_report_core"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# `OutputFormat` is a plain value in every build. The `clap` derive is opt-in
# for the CLI-facing consumers that want it as a flag type; a report plane that
# only renders records compiles no CLI framework.
clap = ["dep:clap"]
# Off by default: a byte-level key-order scanner used only by report-plane
# tests. It is std-only, so enabling it adds no dependency to any build.
test_support = []

[dependencies]
# Only the `Serialize`/`SerializeMap`/`Serializer` traits are used. No derive,
# no `serde_json`, and in particular no `preserve_order`: emission order is
# produced by `serialize_entry` here regardless of how the workspace unifies
# that feature for `serde_json::Map`/`Value` elsewhere.
serde = { workspace = true }
# Optional: the `ValueEnum` derive on `OutputFormat`. The spelling, the
# possible-value descriptions and the CLI parse boundary stay at each caller,
# so enabling this changes no published help or error bytes.
clap = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
# Byte-level tests render the core to a string. This is a dev-only dependency
# of a logic-free leaf, so it cannot couple any program to another.
serde_json = { workspace = true }
