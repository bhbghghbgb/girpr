[package]
name = "girpr-loopback-mock"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "A dependency-free loopback HTTP server for canned test replies and request journals"

[lib]
name = "girpr_loopback_mock"
path = "src/lib.rs"

[lints]
workspace = true

# Deliberately dependency-free. This crate is a test-only leaf: the repair
# facade, its fetch crate, the test fixtures and both capture programs can all
# link it without creating a cycle or pulling in a product crate. There is no
# `[dependencies]` section and there never should be one.
