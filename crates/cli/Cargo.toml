[package]
name = "girpr-cli"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The shared clap-error to usage-code mapping mechanics, parameterised by each caller's own usage code"

[lib]
name = "girpr_cli"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Only `ErrorKind` is used, to tell an answer (`--help` / `--version`) from a
# usage error. No exit table, no exit code of any program and no process
# boundary live here: the caller passes in its own usage code and keeps its own
# way of turning the result into a process status.
clap = "4.6.8"
