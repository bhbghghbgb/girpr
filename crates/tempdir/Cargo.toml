[package]
name = "girpr-tempdir"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The scratch-directory policy every project in the girpr workspace follows: a name nothing collides with, and a tree removed when the test ends"

[lib]
name = "girpr_tempdir"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Shared test fixtures (the `test_support` module) build the option types the
# dev tools' tests hand to girsync. This is a test-support surface only: the
# crate itself is a dev-dependency of every project that uses it, so nothing
# that ships links against either of these.
girsync = { path = "../../tools/sync" }
serde_json = "1.0.154"
