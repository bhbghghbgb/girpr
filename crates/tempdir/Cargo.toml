[package]
name = "girpr-tempdir"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The scratch-directory policy every project in the girpr workspace follows: a name nothing collides with, and a tree removed when the test ends"

[lib]
name = "girpr_tempdir"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The shared test-support module turns console captures into plain text before
# comparing them. The library owns escape-sequence recognition; this crate only
# keeps the helper's signature for its existing callers.
strip-ansi-escapes = "0.2.1"
# Random names and best-effort cleanup for the scratch trees this crate hands
# out. tempfile owns the created directories; this crate stays a thin policy
# wrapper around the shared root and the recognizable name prefix.
tempfile = "3.27.0"
# Deliberately no dependency on girsync (or serde_json): the girsync-coupled
# option/cache/planner fixtures used to live in `test_support`, which made every
# program that took this crate as a dev-dependency inherit girsync's rebuilds.
# Those fixtures now live in `girsync-test-support`, taken only by the two
# programs that already depend on girsync. This crate stays a girsync-free leaf.
