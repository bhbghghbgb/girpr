[package]
name = "girpr-retry-driver"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The policy-free async retry loop over the shared schedule and sleep leaf"

[lib]
name = "girpr_retry_driver"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The driver owns only the loop; the schedule and the sleep hook it drives are
# supplied by this leaf, which keeps every retry policy decision at the caller.
girpr-retry = { path = "../retry" }

[dev-dependencies]
# Only for `#[tokio::test]` in the leaf's own wait-rule tests. A workspace build
# unifies this with the programs' tokio features, but the leaf must also compile
# and test on its own.
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "time"] }
