[package]
name = "girpr-test-http"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "Shared ephemeral-bind, stop-signal and in-flight-gate mechanics for axum-backed test servers"

[lib]
name = "girpr_test_http"
path = "src/lib.rs"

[lints]
workspace = true

# A test-only leaf: the repair facade's route origin, the capture mock and the
# fixture servers all need the same socket/stop/gate mechanics, but each keeps
# its own reply policy and contract here at its call site. This crate never
# scripts a status, a body or a journal assertion. These are regular
# dependencies (not dev-dependencies) because the leaf is consumed by the test
# targets of libraries, where a dev-dependency would not be linked.
[dependencies]
axum = { workspace = true, default-features = false, features = ["http1", "tokio"] }
tokio = { workspace = true, default-features = false, features = ["rt", "net", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, default-features = false, features = ["rt", "net", "sync", "time", "macros", "io-util"] }
