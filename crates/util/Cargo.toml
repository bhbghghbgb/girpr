[package]
name = "girpr-util"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The shared low-level mechanics the girpr product writes and hashes with"

[lib]
name = "girpr_util"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The junction and symlink fixtures are unit-test support, not shipped code.
# They are built for this crate's own tests (`cfg(test)`) and, through this
# feature, for the product's tests that need the same fixtures. No shipped
# binary enables it.
test-support = []

[dependencies]
# JSON-lines parsing of the launcher's ignore/blacklist lists and the context
# wrappers every I/O error carries.
anyhow = "1.0.104"
serde_json = "1.0.154"
# The one read-pass file scanner's hasher. `Md5`/`EMPTY_MD5` themselves are
# re-exported from `girpr-digest`; this is only the hasher behind them.
md-5 = "0.11.0"
# Hex spelling and the fixed-width digest newtype. This crate keeps the scan
# semantics; the leaf owns the byte/hex mechanics.
girpr-digest = { path = "../digest" }
# The Windows device-name predicate, slash folding and ASCII case folding the
# server-path checks are spelled with. The leaf owns the platform primitives;
# this crate keeps its own containment and identity policies.
girpr-fs-names = { path = "../fs-names" }
# Temp-sibling-then-rename publishing for every artifact the product writes.
tempfile = "3.27"
# The malformed-entry warning the config-list readers emit.
tracing = "0.1.44"

[dev-dependencies]
# The scratch directories the file and containment tests write into.
girpr-tempdir = { path = "../tempdir" }
# The shared log-capture helper the config-list warning tests assert through.
girpr-log = { path = "../log", features = ["test-support"] }
