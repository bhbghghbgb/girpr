[package]
name = "girpr-repair-plan"
version = "0.1.0"
edition = "2024"
description = "Repair-plan values and the pure decisions over the work list, purge plan and scope"

[lib]
name = "girpr_repair_plan"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.105"
tracing = "0.1.44"
girpr-chunk-cost = { path = "../../crates/chunk-cost" }
# The half-open range and tiling leaf: the plan keeps its gap records and its
# plan-time error wording, and the leaf owns the cursor arithmetic.
girpr-chunk-layout = { path = "../../crates/chunk-layout" }
girpr-fetch = { path = "../fetch" }
girpr-filter = { path = "../../crates/filter" }
girpr-util-path = { path = "../util-path" }
