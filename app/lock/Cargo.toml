[package]
name = "girpr-lock"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The single-writer run lock and its key policy, used by the girpr product and its lock-only tests"

[lib]
name = "girpr_lock"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# 64-bit FNV-1a for the lock key: a specified, stable algorithm, unlike
# `DefaultHasher`. The byte selection and ASCII case folding stay local.
fnv = "1.0.7"
anyhow = "1.0.105"
# The RFC 3339 `started` field in the lock body names the run to look at; the
# spelling is one of the time leaf's named formats.
girpr-time = { path = "../../crates/time" }
# The link-count and file-identity facts the no-follow body guard reads. This
# crate keeps its own fail-closed policy; the leaf owns only the platform facts.
girpr-fs-identity = { path = "../../crates/fs-identity" }

[dev-dependencies]
# The scratch dirs the lock tests take two locks in without touching the global
# temp directory's key namespace.
girpr-tempdir = { path = "../../crates/tempdir" }
# The fixture refusal type and the symlink classifiers the host-dependent lock
# cases use, so a host that cannot create a link skips out loud. They come from
# the path leaf's test seam; the feature is off in shipped builds.
girpr-util-path = { path = "../util-path", features = ["test-support"] }
