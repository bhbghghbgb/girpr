[package]
name = "girpr-util-io"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "Bounded byte-copy, zero-fill and reserved-capacity capture mechanics shared by the repair writers"

[lib]
name = "girpr_util_io"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The error/context wrapper carried by the write callbacks.
anyhow = { workspace = true }
# The reserved-capacity bounded read is the single implementation promoted in
# util-hash; the capture loop composes it rather than repeating the read.
girpr-util-hash = { path = "../util-hash" }
