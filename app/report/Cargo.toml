[package]
name = "girpr-report"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "The run counters and stdout report plane the girpr repair pipeline reads with"

[lib]
name = "girpr_report"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# `OutputFormat` is re-exported from the shared core; only a CLI-facing
# consumer needs its `clap` derive. Forward the opt-in instead of taking a
# direct dependency, so a consumer that just renders records builds no clap.
clap = ["girpr-report-core/clap"]

[dependencies]
# The ordered-JSON and line-writing mechanics below the plane, and the shared
# `OutputFormat` value set. This crate keeps girpr's own event-first order,
# unsigned counts and 1/0 flags; the core owns no field order, value vocabulary
# or boolean spelling, and no `preserve_order`.
girpr-report-core = { path = "../../crates/report-core" }
# The saturating atomic counter used by the byte and RAM reservations. It is a
# dependency-free leaf, so a config, path or hash edit leaves the report cached.
girpr-util-counter = { path = "../util-counter" }
# The `event` field is emitted through `Serialize`; this crate owns the value
# vocabulary (`Val`) and the label casing. No derive, no `preserve_order`.
serde = { workspace = true }
serde_json = { workspace = true }
# The stdout/log mirror, the meter's refund warning and the phase lines.
tracing = { workspace = true }
# The one `PROGRESS` ticker and its interval. `test-util` is dev-only below.
tokio = { workspace = true, default-features = false, features = ["rt", "time"] }

[dev-dependencies]
# The shared log-capture helper, reached through this crate's own tests. The
# `test-support` feature is off in every shipped build.
girpr-log = { path = "../../crates/log", features = ["test-support"] }
# Paused time makes the progress-guard cadence and stop-on-drop deterministic.
tokio = { workspace = true, default-features = false, features = ["test-util"] }
