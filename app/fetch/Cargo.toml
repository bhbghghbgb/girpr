[package]
name = "girpr-fetch"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The HYP and Sophon fetch mechanics the girpr repair pipeline reads with"

[lib]
name = "girpr_fetch"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# `ReuseEntry` is re-exported at `sophon::` only for tests that need to build a
# `FileReuse` by hand (the facade's unit tests). It is a dependency's `cfg(test)`
# seam, not shipped API: the facade enables this feature through its
# dev-dependency, so ordinary builds do not expose the extra alias.
test-support = []

[dependencies]
anyhow = "1.0.105"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# API sizes arrive as either a JSON number or a numeric string; the field
# deserializer owns both shapes. The chrono helpers are not used here.
serde-aux = { version = "4.7.0", default-features = false }
# The HYP/Sophon JSON calls and the streamed downloads. These are the
# heavy dependencies this crate isolates: an edit to the repair, report or CLI
# modules above leaves this crate (and its reqwest/zstd/prost tree) cached.
reqwest = { version = "0.13.5", features = ["json", "stream"] }
# Query values are escaped with a byte table and an exact AsciiSet, not the
# form serializer: the recorded request URLs use literal brackets and `%20`
# for spaces, and `Url`'s query_pairs_mut() would rewrite both.
percent-encoding = "2.3.2"
# The idle window on the two buffered JSON body reads uses the timer directly;
# a client-wide total timeout would abort large streamed bodies instead.
tokio = { version = "1.54.1", default-features = false, features = ["time"] }
prost = "0.14.6"
zstd = "0.14.5"
# `StreamExt` combinators and the `Stream` trait the chunk sink is driven with.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tracing = "0.1.44"
# The region values, the digest/hex and protobuf byte mechanics, the shared
# retry schedule and the low-level scan/digest helpers. This crate keeps its
# own request policy, decode/verify seam and attempt loops; only the leaves
# hold shared values or mechanics. The scan/digest helpers come from the hash
# leaf directly, so a config or path edit leaves this fetch tree cached.
girpr-model = { path = "../../crates/model" }
girpr-digest = { path = "../../crates/digest" }
girpr-proto = { path = "../../crates/proto" }
# The chunk-identity value types: the digest-bytes/length key and the borrowed
# view the reuse map's match predicate and the manifest diff share. The leaf
# holds no index, collision policy or first-match order — those stay here.
girpr-chunk-identity = { path = "../../crates/chunk-identity" }
girpr-retry = { path = "../../crates/retry" }
# The persistent plan's value types and pure rules. The manifest descriptors
# are `girpr_dispatch` values; this crate owns only their fetch and the
# full-file downloader, never the decisions made over the parsed rows.
girpr-dispatch = { path = "../dispatch" }
girpr-persistent-plan = { path = "../persistent-plan" }
girpr-util-hash = { path = "../util-hash" }
# The downloader writes a verified body to a temp sibling before publishing it.
tempfile = "3.27.0"
# The clean-rel spelling used to key the local reuse map. It is a path leaf,
# not the config writer, so an ini edit leaves this fetch tree cached.
girpr-util-path = { path = "../util-path" }

[dev-dependencies]
# The wiremock-backed loopback server the canned-reply helper scripts. This
# fetch-side helper stays local and keeps its own contract: the product's and
# both capture mocks script different replies and read different journals.
girpr-loopback-mock = { path = "../../crates/loopback-mock" }
# Download tests write into one scratch tree per case, under <temp>/girpr-test/.
girpr-tempdir = { path = "../../crates/tempdir" }
# The `#[tokio::test]` driver. `reqwest` enables the network surface in every
# build; naming it here keeps the tests' own requirement explicit.
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util"] }
