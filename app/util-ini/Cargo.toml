[package]
name = "girpr-util-ini"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "The launcher config.ini, ignore-list and blacklist mechanics the girpr workspace reads and bumps"

[lib]
name = "girpr_util_ini"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# JSON-lines parsing of the launcher's ignore/blacklist lists and the context
# wrappers every I/O error carries.
anyhow = { workspace = true }
serde_json = { workspace = true }
# Section/key tokenisation and duplicate folding for config.ini. The loader
# runs in no-escape mode via the crate's own API so Windows paths keep their
# backslashes; the launcher-specific policy stays in `ini.rs`.
rust-ini = { workspace = true, features = ["case-insensitive"] }
# The malformed-entry warning the config-list readers emit.
tracing = { workspace = true }
# The BOM-stripping, 1-based, blank-skipping line iterator shared with the
# audio, manifest and descriptor readers. A BOM-only file is blank here, while
# the audio reader refuses it — that decision stays at each call site.
girpr-line-reader = { path = "../../crates/line-reader" }
# The containment check and the atomic publish the config writer bumps through.
# Keeping the config writer in its own crate means an edit here leaves the
# path, hash and counter crates (and their consumers) cached.
girpr-util-path = { path = "../util-path" }

[dev-dependencies]
# The scratch directories the config tests write into.
girpr-tempdir = { path = "../../crates/tempdir" }
# The shared log-capture helper the config-list warning tests assert through.
girpr-log = { path = "../../crates/log", features = ["test-support"] }
# The junction/symlink fixtures the host-dependent config cases share with the
# path containment tests. The feature is off in shipped builds.
girpr-util-path = { path = "../util-path", features = ["test-support"] }
