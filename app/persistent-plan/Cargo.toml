[package]
name = "girpr-persistent-plan"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "Persistent-directory plan values and pure decisions for girpr"

[lib]
name = "girpr_persistent_plan"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The dispatcher's value types are the only product dependency: `source` is a
# `ManifestKind` and the URL/marker inputs come from `DispatchInfo`. No fetch
# edge — this crate never opens a socket or a file.
girpr-dispatch = { path = "../dispatch" }
# Digest spelling (MD5 and XXH64) and the path mechanics (clean rel spelling
# and the case-folded identity key) are the two leaves this crate is allowed
# to depend on. Everything else here is a pure decision over values.
girpr-digest = { path = "../../crates/digest" }
# The shared 1-based, blank-skipping line iterator. The manifest has no BOM
# convention (`Keep`), and its typed `ParseError` wording stays here.
girpr-line-reader = { path = "../../crates/line-reader" }
# The pure whole-file gate: size first, then the preferred digest. This crate
# keeps the row's algorithm preference and its own `DigestVerdict`; the leaf
# owns only the decision over the values handed to it.
girpr-chunk-verify = { path = "../chunk-verify" }
girpr-util-path = { path = "../util-path" }
# CDN asset URLs use the shared path-segment append mechanics. This crate
# keeps its prefix selection, hotfix swap and `PlanError` wording local.
girpr-request-url = { path = "../../crates/request-url" }
# NDJSON is the manifest wire shape; serde's unknown-key tolerance is what
# makes `isPatch`/`category`/`localName` parsed-but-ignored rather than fatal.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
