[package]
name = "girpr-util-path"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "The server-path containment, atomic publish, read-only clearing and path-test fixture mechanics the girpr workspace uses"

[lib]
name = "girpr_util_path"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The junction and symlink fixtures are unit-test support, not shipped code.
# They are built for this crate's own tests and, through this feature, for the
# tests of the crates and programs that need the same fixtures. No shipped
# binary enables it.
test-support = []

[dependencies]
# The error/context wrappers the path checks carry.
anyhow = { workspace = true }
# The Windows device-name predicate, slash folding and ASCII case folding the
# server-path checks are spelled with. This crate keeps its own containment and
# identity policies; the leaf owns only the platform primitives.
girpr-fs-names = { path = "../../crates/fs-names" }
# The lexical relative-path shape validator, parameterised by this crate's
# normalising policy and device rule. The path names, ID mapping and containment
# decisions stay here; the leaf owns only the shape checks and their order.
girpr-path-shape = { path = "../../crates/path-shape" }
# Temp-sibling-then-rename publishing for every artifact the product writes.
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The junction fixture delegates the reparse-point mechanics to this crate.
# It is Windows-only and only reached from the `test-support` module, which is
# compiled out of shipped targets. Default features are off: the crate's
# `unstable_admin` default would request backup/restore privileges, while an
# ordinary junction fixture needs no elevation.
junction = { workspace = true, default-features = false }

[dev-dependencies]
# The junction fixture's caught-panic helper uses the same payload downcast as
# the two programs and their tests; the leaf is logic-free and test-only here.
girpr-async-join = { path = "../../crates/async-join" }
# The scratch directories the file and containment tests write into.
girpr-tempdir = { path = "../../crates/tempdir" }
