[package]
name = "girpr-dispatch"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "Collapse dispatcher metadata unwrap, query and protobuf decode for girpr"

[lib]
name = "girpr_dispatch"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The new dependency tree this leaf isolates. An edit to repair, report or the
# CLI leaves all of it cached; none of those crates can reach these types.
# `rsa` needs `pkcs1v15` for both the metadata master key and the dispatcher
# response — the default features alone do not enable decryption.
rsa = { workspace = true, features = ["pkcs1v15"] }
brotli = { workspace = true }
base64 = { workspace = true }
prost = { workspace = true }
# The dispatcher key arrives as .NET `RSAKeyValue` XML; the `serialize`
# feature is what provides `quick_xml::de::from_str`.
quick-xml = { workspace = true, features = ["serialize"] }
# The `--biz` values and the digest/hex spelling come from the existing
# value/mechanics leaves. No `girpr-fetch`: its transport is this crate's own
# injectable seam, and depending on it would close the graph.
girpr-model = { path = "../../crates/model" }
girpr-digest = { path = "../../crates/digest" }
# The shared blank-skipping line iterator. The descriptor has no BOM convention
# (`Keep`); its `DispatchError` wording stays here.
girpr-line-reader = { path = "../../crates/line-reader" }
# The CDN path-segment append mechanics are shared with the persistent plan;
# the error wording, prefix selection and `DispatchError` type stay here.
girpr-request-url = { path = "../../crates/request-url" }
# JSON is the metadata/envelope format; the descriptor rows use serde's derive.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The dispatcher template's authority is forced and its fixed query parameters
# are checked with `Url` / `Url::query_pairs`, not local string splitting.
url = { workspace = true }
# Opaque wire fields are reported at debug level, never used to place files.
tracing = { workspace = true }

[dev-dependencies]
# Only the offline tests build PKCS#1 v1.5 ciphertext to feed the injected
# fetcher; no shipped code depends on an RNG.
rand = { workspace = true }
