[package]
name = "girpr-audio"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The audio scan-file read/write and effective-selection mechanics the girpr repair pipeline uses"

[lib]
name = "girpr_audio"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The error/context wrappers and the malformed-selection, unknown-line and
# resolution warnings this boundary emits.
anyhow = "1.0.105"
tracing = "0.1.44"
# The four code/display-name pairs, their canonical order, the caller-supplied
# reverse lookup and the canonical join. This crate keeps the read/write and
# selection policy and passes its own trailing-newline and alias parameters;
# the leaf owns only the mechanics.
girpr-audio-language = { path = "../../crates/audio-language" }
# The BOM-stripping, 1-based, blank-skipping line iterator shared with the
# launcher-list, manifest and descriptor readers. The BOM-only refusal stays
# here, on the raw text, because this program's meaning is the opposite of the
# config-list reader's.
girpr-line-reader = { path = "../../crates/line-reader" }
# Server-controlled path containment and the atomic temp-then-rename publish.
# These are low-level mechanics with no product policy, so an edit to the
# config writer, the hash or the counter leaves the whole audio boundary
# cached. This boundary depends on the path mechanics directly.
girpr-util-path = { path = "../util-path" }

[dev-dependencies]
# The scratch directories the scan-file tests read and write through.
girpr-tempdir = { path = "../../crates/tempdir" }
