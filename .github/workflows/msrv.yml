name: msrv

# Advisory: the default branch does not require these checks, so a docs-only
# change correctly produces no `msrv` run. If this becomes a required check,
# remove the path filters or add an always-run summary job: GitHub leaves a
# required check that never runs pending.
on:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'tests/scripts/check-msrv.ps1'
      - '.github/workflows/msrv.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'tests/scripts/check-msrv.ps1'
      - '.github/workflows/msrv.yml'

permissions:
  contents: read

concurrency:
  group: msrv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The script installs the older toolchains itself. The cache is keyed by
      # the host toolchain and the manifests/lockfiles; cargo fingerprints
      # artifacts by compiler version, so sharing the target directory across
      # the per-member `cargo +<version>` builds is safe.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: 'true'
      - name: Check every member at its declared rust-version
        shell: pwsh
        run: ./tests/scripts/check-msrv.ps1

  iot-bench:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # The bench pins redb to the newest line that still supports the
      # workspace MSRV. Build it with that toolchain, not the runner's default
      # stable, so a dependency bump that raises the bench's floor fails here.
      RUSTUP_TOOLCHAIN: '1.89'
    steps:
      - uses: actions/checkout@v4
      # The bench is a standalone workspace with its own lockfile, so this is
      # the only job that compiles its pinned dependency.
      - name: Install Rust 1.89
        shell: pwsh
        run: rustup toolchain install 1.89 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tests/scripts/io-profile/iot-bench -> target
      - name: Check the standalone I/O bench
        run: cargo check --locked --manifest-path tests/scripts/io-profile/iot-bench/Cargo.toml
