[package]
name = "gircap-http"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "The logic-free HTTP mechanics owned by gircap: the reqwest transport, the retrying fetcher, the request log and the error-body budget"

[lib]
name = "gircap_http"
path = "src/lib.rs"

# The same tools-only policy gircap itself uses: this crate holds mechanics, not
# a repair path, so `unwrap_used`/`expect_used` warnings would be noise. The
# `gircap-` prefix, the `tools/capture/` home and this local lint table are a
# deliberate deviation from the shared-crate convention (which uses
# `girpr-<policy>` in `crates/` and `[lints] workspace = true`); do not "correct" them.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dependencies]
# The clamped exponential retry schedule and the injectable sleep driver are the
# shared mechanics leaf; gircap-http passes its own zero-jitter schedule. The
# attempt loop itself is the policy-free leaf directly above it, so both tools
# drive the same waits and stop rules while keeping their own jitter and policy.
girpr-retry = { path = "../../../crates/retry" }
girpr-retry-driver = { path = "../../../crates/retry-driver" }
# The API identity sent on every request. The leaf owns the one literal shared
# with the repair binary; this crate re-exports it so the fetcher and gircap's
# `logging` module keep the same names and the request log stays byte-identical.
girpr-hyp-wire = { path = "../../../crates/hyp-wire" }
# The ordered-join window and panic-payload rule live in the shared logic-free
# leaf; this module keeps only gircap's own wording and its `JoinOutcome` ->
# `ApiError` mapping at the call sites.
girpr-async-join = { path = "../../../crates/async-join" }
# Hex spelling of bytes for the request log's header digests. Logic-free leaf:
# no flag, no exit code, no published shape.
girpr-digest = { path = "../../../crates/digest" }
# The zero-copy chunk type reqwest yields. Naming it directly lets the transport
# hand body bytes to the sinks without copying every chunk into a fresh `Vec`.
bytes = { workspace = true }
# The transport, the client and header maps. This crate is now the sole owner of
# reqwest for gircap: the parent package used to take a direct reqwest dep only
# for `config::validate_base`'s `Url`, which parses with the `url` crate itself.
# The fetcher/transport mechanics compile once here and stay cached across edits
# to emit/blobs/manifest in the parent package.
reqwest = { workspace = true }
# The runtime for the injectable timers the backoff awaits and for the blocking
# joins; no `fs`/`io`/`net`/`process` features are requested here.
tokio = { workspace = true, default-features = false, features = ["rt-multi-thread", "macros", "time"] }
# Derive `Display`/`Error` for `ApiError` without changing its format strings.
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
# The millisecond RFC 3339 spelling in the request log is a named format in the
# time leaf; this crate keeps only the seam its callers already use.
girpr-time = { path = "../../../crates/time" }
tracing = { workspace = true }

[dev-dependencies]
# The join tests need an in-flight signal channel; the window itself lives in
# the shared leaf, so `futures` is a test-only dependency of this crate now.
futures = { workspace = true }
# The mechanics tests build scratch directories and script canned replies on a
# loopback server. Neither is needed by a shipped build of this crate; gircap's
# own canned mock encodes different contracts and is deliberately not borrowed
# here (docs/00-spec.md §2).
girpr-tempdir = { path = "../../../crates/tempdir" }
girpr-loopback-mock = { path = "../../../crates/loopback-mock" }
