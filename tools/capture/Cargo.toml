[package]
name = "gircap"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "Dev-only live-artifact capture tool: builds self-contained fixture bundles (real game_dir, real API bodies, real chunk blobs) plus offline ground truth, for testing the repair binary"

# gircap shares no code with the repair binary: no path dep on the `girpr`
# package, no registry dep, and no `Command` against its binary anywhere in
# the tree (docs/00-spec.md §2). Its eleven path deps are leaf crates holding a
# shared *policy* or *mechanics* and no logic of any program: `girpr-log` (the
# log-file and log-level policy — flag names, environment variables, default
# levels and default paths), `girpr-report-core` (ordered-JSON and line-writing
# mechanics — gircap supplies its own event-first order, event field, value
# types, percent-encoding and boolean spelling), `girpr-digest` (the hex
# spelling and fixed-width digest mechanics — no flag, no exit code and no
# published shape),
# `girpr-fs-names` (the Windows device-name predicate mechanism — gircap passes
# its own reserved set and raw-stem comparison; no program rule is borrowed),
# `girpr-retry` (the retry schedule factory and injectable sleep driver —
# gircap keeps its own zero jitter and its own side-effectful attempt loop),
# `girpr-exit` (the exit-table generation mechanism — the enum/`ALL`/code/pin
# pattern only; gircap supplies its own codes and meanings),
# `girpr-cli` (the clap-error to usage-code mapping mechanics — help/version map
# to 0 and every other error to the usage code gircap passes in),
# `girpr-audio-language` (the lower + `_`→`-` token primitive and the four
# code/display-name pairs — gircap keeps its own trim, none sentinel and
# path-component validation),
# `girpr-proto` (the Sophon protobuf wire types — tags, the misspelled `chuncks`
# and opaque tag 6 only; gircap keeps its own dump format and all measurement,
# validation and normalisation logic in this crate),
# `girpr-model` (the region identity, ids, channel tuples, base URLs and the
# chunk-mode/channel-endpoint values — gircap keeps its `Biz::resolve` policy,
# its `Endpoints` override seam and every URL builder in this crate) and
# `girpr-tempdir` (the scratch-directory policy, a dev-dependency, so the
# tree a test writes into is named and removed the same way in all three
# projects).

# A tools-only subset of the shared policy. The dev tools do not inherit the
# workspace table because `unwrap_used`/`expect_used` are deliberate there for
# the repair path and would be noise here: a panic in a dev tool is a failed
# developer run, not a failed repair of a user's install. What is checked is
# `clippy::all` plus denied `unsafe_code`, the same as the product otherwise.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[lib]
name = "gircap"
path = "src/lib.rs"

[[bin]]
name = "gircap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
# Derive `Display`/`Error` for the three error types instead of hand-writing
# them; the format strings are unchanged. Already in the workspace lockfile.
thiserror = "2"
# The clamped exponential retry schedule and the sleep hook both come from the
# leaf; gircap passes `0.0` jitter so capture artifacts stay byte-stable and
# diffable, and keeps its own side-effectful attempt loop local.
girpr-retry = { path = "../../crates/retry" }
# The log-file and log-level policy, shared with the repair binary and with
# `girsync`. It is a leaf crate with no dependency on any of the three
# programs, so sharing it couples nothing that matters (see docs/00-spec.md
# §2, "no shared contracts": the flag *names* and defaults are shared on
# purpose now, the behaviour is not).
girpr-log = { path = "../../crates/log" }
# The exit-table generation mechanism, shared with the repair binary. It is a
# logic-free leaf: the enum/`ALL`/code/pin pattern comes from the macro, while
# gircap supplies its own codes, meanings and helper methods — no exit-code
# value crosses between the tools.
girpr-exit = { path = "../../crates/exit" }
# The clap-error to usage-code mapping mechanics, shared with the repair
# binary. The leaf only decides help/version -> 0, else the usage code passed
# in; gircap keeps its own `ExitCode` type and `exit_with` process boundary.
girpr-cli = { path = "../../crates/cli" }
# The runtime (`#[tokio::main]` runs the multi-threaded one), its macros
# (`#[tokio::main]`, `#[tokio::test]`) and the timers the retry backoff awaits.
# No source here calls `tokio::fs`, `io`, `process`, `net`, `sync` or `signal`.
# The graph still receives `net` and `sync` because `reqwest` enables them in
# every build, and `io-util` through reqwest's h2/hyper tree. Those are
# requests made by dependencies, not features this package asks for; the
# saving is every feature that neither this list nor a dependency requests.
# `fs` is not in this package's own graph:
# `reqwest`'s `stream` feature is what pulls `tokio/fs`, and this manifest does
# not enable it. A `--workspace` build unifies the repair binary's
# `reqwest/stream` into the same tokio, and then it is.
# `default-features = false` keeps the request to exactly this list; reqwest's
# dependency tree still enables tokio's empty `default` feature, which adds
# nothing. `spawn`/`spawn_blocking`/`JoinSet` come with `rt`, which
# `rt-multi-thread` already includes.
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
# No `json` and no `stream`: every body is decoded with `serde_json::from_slice`
# or handed on as raw bytes, and nothing reads a streaming body. The `stream`
# feature is what a future "hash the blob as it lands" would ask for.
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
prost = "0.14.6"
# The shared Sophon wire types: one byte layout for the three protobuf messages
# both programs decode. The leaf owns tags and field names only; gircap's dump
# key names are preserved and every measurement/validation helper stays local.
girpr-proto = { path = "../../crates/proto" }
# The shared region values — the three ids, their launcher/game/channel tuples,
# the four production bases and the two byte-stable constants. A logic-free
# leaf: gircap keeps its own `Biz::resolve`, its `Endpoints` override seam and
# its request builders. `clap` is on because `Biz` is the `--biz` flag type.
girpr-model = { path = "../../crates/model", features = ["clap"] }
zstd = "0.14.4"
md-5 = "0.11.0"
# Hex spelling of digests, shared with the repair binary and the converter. A
# leaf mechanics crate: gircap still publishes lowercase hex strings and owns
# its own algorithm set, it only borrows the spelling.
girpr-digest = { path = "../../crates/digest" }
# The Windows device-name predicate mechanism, shared with the repair binary.
# A leaf crate that owns only the mechanism: gircap keeps its exact rule (no
# `CLOCK$`, raw-stem comparison) by passing the reserved set and trim flag.
girpr-fs-names = { path = "../../crates/fs-names" }
# The shared lower + `_`→`-` audio-token primitive and the four canonical
# code/display-name pairs. The leaf holds no audio policy: gircap keeps its own
# trimming, ASCII folding, `none` sentinel and path-component validation, and
# writes the same scan-file bytes as the repair binary for the same selection.
girpr-audio-language = { path = "../../crates/audio-language" }
# The ordered-JSON writer and the one newline-appending line writer. A logic-free
# leaf: it emits the entries in the order gircap supplies, with gircap's own
# `event` value, `Val` types, `serde_json` escaping and `true`/`false` spelling.
girpr-report-core = { path = "../../crates/report-core" }
# Percent-escape spelling for query values and the stdout text form. Already in
# the lockfile through `reqwest`/`url`; named here so this crate uses it directly.
percent-encoding = "2.3.2"
# SHA-256 is computed inside `girpr-digest`, shared by all three programs;
# this crate only publishes its lowercase hex, so it no longer depends on the
# hasher directly.
flate2 = "1.1.11"
# Directory walks in the index and inventory passes. Already in the shared
# lockfile through the other workspace members; no new dependency is fetched.
walkdir = "2.5.0"
# The `game/config.ini` version probe. A streaming parser is used rather than a
# map-building one (`configparser`/`ini`) because gircap takes the FIRST
# `game_version` in `[General]`; a hash map keeps only the last. This keeps that
# reader's policy distinct from the repair binary's last-match/no-section rule.
ini_core = "0.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
# Only the `non_blocking` writer guard, which is what flushes the tail of a
# --log-file run. No rolling: a capture writes one log, it is not a daemon.
tracing-appender = "0.2.5"
chrono = { version = "0.4.45", features = ["clock"] }

[dev-dependencies]
# `tests/cli_contract.rs` asserts on `--output json` records, so it parses them.
serde_json = "1.0.154"
# The shared read-only bundle fixture (`tests/common/mod.rs`) takes a real
# cross-process file lock so parallel `nextest` processes capture the default
# bundle once and then all read the same on-disk tree. Already in the lock file
# through `sled`; no new dependency is fetched.
fs2 = "0.4.3"
# The scratch-directory helper, shared with the repair binary and with
# `girsync`: one name, one construction and one cleanup for every test in the
# workspace. A dev-dependency, because nothing that ships creates a scratch
# directory.
girpr-tempdir = { path = "../../crates/tempdir" }
# Canned reply servers in the HTTP unit tests. The library owns the listener,
# request journal and invocation counts; the tests only script statuses/bodies
# and assert on what it recorded. The malformed-response tests keep a small
# raw-socket helper, because a well-behaved mock server cannot lie about
# `Content-Length`.
wiremock = "0.6"

# Deliberately absent: `twox-hash`. The 16-hex manifest-id prefix is not a hash
# of any observable input (docs/00-spec.md §3.7), so an xxh64 implementation
# would be unused code asserting something false.