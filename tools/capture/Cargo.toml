[package]
name = "gircap"
version = "0.1.0"
edition = "2024"
description = "Dev-only live-artifact capture tool: builds self-contained fixture bundles (real game_dir, real API bodies, real chunk blobs) plus offline ground truth, for testing the repair binary"

# gircap shares no code with the repair binary: no path dep on the `girpr`
# package, no registry dep, and no `Command` against its binary anywhere in
# the tree (docs/00-spec.md §2). Its two path deps are leaf crates holding a
# shared *policy* and no logic of any program: `girpr-log` (the log-file and
# log-level policy — flag names, environment variables, default levels and
# default paths) and `girpr-tempdir` (the scratch-directory policy, a
# dev-dependency, so the tree a test writes into is named and removed the same
# way in all three projects).

# A tools-only subset of the shared policy. The dev tools do not inherit the
# workspace table because `unwrap_used`/`expect_used` are deliberate there for
# the repair path and would be noise here: a panic in a dev tool is a failed
# developer run, not a failed repair of a user's install. What is checked is
# `clippy::all` plus denied `unsafe_code`, the same as the product otherwise.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[lib]
name = "gircap"
path = "src/lib.rs"

[[bin]]
name = "gircap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# The log-file and log-level policy, shared with the repair binary and with
# `girsync`. It is a leaf crate with no dependency on any of the three
# programs, so sharing it couples nothing that matters (see docs/00-spec.md
# §2, "no shared contracts": the flag *names* and defaults are shared on
# purpose now, the behaviour is not).
girpr-log = { path = "../../crates/log" }
# The runtime (`#[tokio::main]` runs the multi-threaded one), its macros
# (`#[tokio::main]`, `#[tokio::test]`) and the timers the retry backoff awaits.
# Nothing here uses `tokio::fs`, `io`, `process`, `net`, `sync` or `signal`;
# `reqwest` enables tokio's network surface in every build anyway, so the
# saving is what this list does not ask for. `spawn`/`spawn_blocking`/`JoinSet`
# come with `rt`, which `rt-multi-thread` already includes.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# No `json` and no `stream`: every body is decoded with `serde_json::from_slice`
# or handed on as raw bytes, and nothing reads a streaming body. The `stream`
# feature is what a future "hash the blob as it lands" would ask for.
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
zstd = "0.13"
md-5 = "0.10"
sha2 = "0.10"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Only the `non_blocking` writer guard, which is what flushes the tail of a
# --log-file run. No rolling: a capture writes one log, it is not a daemon.
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
# `tests/cli_contract.rs` asserts on `--output json` records, so it parses them.
serde_json = "1"
# The scratch-directory helper, shared with the repair binary and with
# `girsync`: one name, one construction and one cleanup for every test in the
# workspace. A dev-dependency, because nothing that ships creates a scratch
# directory.
girpr-tempdir = { path = "../../crates/tempdir" }

# Deliberately absent: `twox-hash`. The 16-hex manifest-id prefix is not a hash
# of any observable input (docs/00-spec.md §3.7), so an xxh64 implementation
# would be unused code asserting something false.