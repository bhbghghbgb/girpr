[package]
name = "gircap"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "Dev-only live-artifact capture tool: builds self-contained fixture bundles (real game_dir, real API bodies, real chunk blobs) plus offline ground truth, for testing the repair binary"

# gircap shares no code with the repair binary: no path dep on the `girpr`
# package, no registry dep, and no `Command` against its binary anywhere in
# the tree (docs/00-spec.md §2). Its seventeen shared path deps are leaf crates
# holding a shared *policy* or *mechanics* and no logic of any program: `girpr-log` (the
# log-file and log-level policy — flag names, environment variables, default
# levels and default paths), `girpr-time` (the named UTC timestamp formats —
# the compact sortable stamp, two RFC 3339 spellings and chrono's default, each
# with its own spelling; gircap keeps every stamped artifact byte),
# `girpr-report-core` (ordered-JSON and line-writing
# mechanics — gircap supplies its own event-first order, event field, value
# types, percent-encoding and boolean spelling), `girpr-digest` (the hex
# spelling and fixed-width digest mechanics — no flag, no exit code and no
# published shape), `girpr-chunk-identity` (the digest/length identity key, the
# borrowed view and the case-insensitive parse, plus the lowercase-normalisation
# rule — gircap normalises at its own decode boundary and keeps its sets,
# collision policy, first-match order and every published byte),
# `girpr-chunk-cost` (the saturating Σ compressed_size projection fold — gircap
# marks every wanted chunk as a download and keeps its retention sets, its
# ranking and every published byte),
# `girpr-fs-names` (the Windows device-name predicate mechanism — gircap passes
# its own reserved set and raw-stem comparison; no program rule is borrowed),
# `girpr-path-shape` (the lexical relative-path shape validator — gircap passes
# its strict spelling policy and raw-stem device rule and keeps its own stable
# rule IDs, messages and every published refusal byte),
# `girpr-retry` (the retry schedule factory and injectable sleep driver —
# gircap keeps its own zero jitter and its own side-effectful attempt loop),
# `girpr-exit` (the exit-table generation mechanism — the enum/`ALL`/code/pin
# pattern only; gircap supplies its own codes and meanings),
# `girpr-cli` (the clap-error to usage-code mapping mechanics — help/version map
# to 0 and every other error to the usage code gircap passes in),
# `girpr-value-ranges` (pure inclusive-range facts — below-min/above-max/in-range
# and the offending value only; gircap keeps its own messages, its bounds and
# its exit-1 class),
# `girpr-audio-language` (the lower + `_`→`-` token primitive and the four
# code/display-name pairs — gircap keeps its own trim, none sentinel and
# path-component validation),
# `girpr-proto` (the Sophon protobuf wire types — tags, the misspelled `chuncks`
# and opaque tag 6 only; gircap keeps its own dump format and all measurement,
# validation and normalisation logic in this crate),
# `girpr-model` (the region identity, ids, channel tuples, base URLs and the
# chunk-mode/channel-endpoint values — gircap keeps its `Biz::resolve` policy,
# its `Endpoints` override seam and every URL builder in this crate) and
# `girpr-tempdir` (the scratch-directory policy, a dev-dependency, so the
# tree a test writes into is named and removed the same way in all three
# projects), and `girpr-loopback-mock` (a dependency-free loopback HTTP server
# for canned replies, a dev-dependency shared by the repair, fetch and both
# capture test suites; it holds no program logic and each caller keeps its own
# scripting contract on top of it).
#
# The offline mock is **not** a shared leaf: `gircap-test-support` below
# is a gircap-only dev library that inverts onto this package's public seams. It
# borrows nothing from the repair binary, so the "no shared fixtures" rule in
# docs/00-spec.md §2 is unchanged.
#
# The HTTP mechanics are likewise not a shared leaf: `gircap-http` below
# is gircap's own logic-free crate for the reqwest transport, the retrying
# fetcher, the request log and the error-body budget. gircap depends on it
# directly so an edit to emit/blobs/manifest leaves it cached; it owns no exit
# code, version pair, region value, probe decision or artifact writer, depends
# on no program crate, and invokes no binary. The digesting-file trait lives in
# the shared `girpr-digest` leaf (re-exported here); the fixed User-Agent and the
# ordered-join loop's consumers stay in this package.
# `reqwest` is a direct dependency of `gircap-http` only: gircap parses the two
# API base overrides with the `url` crate directly, with no transport dependency.
#
# The digest/zstd mechanics are likewise not a shared leaf: `gircap-hash` below
# is gircap's own logic-free crate for the one-pass/one-shot digests, the hex
# spelling, the gzip rule and the bounded zstd decode/measure helpers. gircap
# depends on it directly so an edit to emit/blobs/manifest leaves it and its
# native zstd tree cached. It owns no exit code, version pair, region value,
# probe decision or artifact writer, depends on no program crate (only the
# logic-free `girpr-digest` leaf), and invokes no binary.
# The zstd_measure/zstd_measure_from pair stays deliberately duplicated there.
#
# The three gircap-owned crates below (`gircap-http`, `gircap-hash`,
# `gircap-test-support`) deliberately deviate from the shared-crate convention:
# they use the `gircap-` prefix, live under `tools/capture/` rather than
# `crates/`, and set their own tools-only lint policy instead of
# `[lints] workspace = true`. That convention is for crates shared between
# programs; these hold gircap's own mechanics and test fixtures, so a later
# session should not "correct" the prefix, the location or the lint table.

# A tools-only subset of the shared policy. The dev tools do not inherit the
# workspace table because `unwrap_used`/`expect_used` are deliberate there for
# the repair path and would be noise here: a panic in a dev tool is a failed
# developer run, not a failed repair of a user's install. What is checked is
# `clippy::all` plus denied `unsafe_code`, the same as the product otherwise.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[lib]
name = "gircap"
path = "src/lib.rs"

[[bin]]
name = "gircap"
path = "src/main.rs"

[features]
# Empty opt-in for the hand-run `bundle_shapes` test target. No dependencies are
# pulled in: the feature exists only to decide whether Cargo compiles and links
# that one test binary.
manual-tests = []

[[test]]
name = "bundle_shapes"
path = "tests/bundle_shapes.rs"
# All three cases are `#[ignore]`d and run by hand. Gating the target means a
# normal build or test run no longer compiles and links this binary; the cases
# and their on-disk assertions are unchanged. A crate-level cfg in the source
# keeps the file inert if it is ever compiled without the feature. Run it with:
#   cargo nextest run -p gircap --features manual-tests --test bundle_shapes --run-ignored only
required-features = ["manual-tests"]

[dependencies]
# The HTTP mechanics crate is gircap's own logic-free leaf: the reqwest transport,
# the retrying fetcher, the request log and the error-body budget live there, and
# this package depends on it directly (not merely through a re-export) so an edit
# to emit/blobs/manifest leaves that crate and its native tree cached. gircap
# keeps the program policy on its side: probe decisions, negative-probe inputs,
# region resolution, artifact writing and exit-code mapping. It depends on no
# girpr crate and invokes no binary (docs/00-spec.md §2).
gircap-http = { path = "http" }
# The digest/zstd mechanics crate is gircap's own logic-free leaf: the digests,
# hex spelling, gzip rule and bounded zstd helpers compile once there and stay
# cached across edits to emit/blobs/manifest in this package. gircap keeps the
# gzip threshold flag, the report bytes and every call site here; it depends on
# no program crate and invokes no binary (docs/00-spec.md §2).
gircap-hash = { path = "hash" }
clap = { version = "4.6.9", features = ["derive"] }
# Derive `Display`/`Error` for the three error types instead of hand-writing
# them; the format strings are unchanged. Already in the workspace lockfile.
thiserror = "2"
# The clamped exponential retry schedule and the sleep hook both come from the
# leaf; gircap passes `0.0` jitter so capture artifacts stay byte-stable and
# diffable, and keeps its own side-effectful attempt loop local.
girpr-retry = { path = "../../crates/retry" }
# The log-file and log-level policy, shared with the repair binary and with
# `girsync`. It is a leaf crate with no dependency on any of the three
# programs, so sharing it couples nothing that matters (see docs/00-spec.md
# §2, "no shared contracts": the flag *names* and defaults are shared on
# purpose now, the behaviour is not).
girpr-log = { path = "../../crates/log" }
# The named UTC timestamp formats. The compact stamp names capture and manifest
# ids; gircap keeps its own artifact bytes and the other formats stay distinct.
girpr-time = { path = "../../crates/time" }
# The exit-table generation mechanism, shared with the repair binary. It is a
# logic-free leaf: the enum/`ALL`/code/pin pattern comes from the macro, while
# gircap supplies its own codes, meanings and helper methods — no exit-code
# value crosses between the tools.
girpr-exit = { path = "../../crates/exit" }
# The clap-error to usage-code mapping mechanics, shared with the repair
# binary. The leaf only decides help/version -> 0, else the usage code passed
# in; gircap keeps its own `ExitCode` type and `exit_with` process boundary.
girpr-cli = { path = "../../crates/cli" }
# Pure inclusive-range facts for the numeric flags this tool and the other two
# programs validate. The leaf only answers below-min/above-max/in-range and
# carries the offending value; gircap keeps its `UsageError` wording and its
# exit-1 class local.
girpr-value-ranges = { path = "../../crates/value-ranges" }
# The runtime (`#[tokio::main]` runs the multi-threaded one), its macros
# (`#[tokio::main]`, `#[tokio::test]`) and the timers the retry backoff awaits.
# No source here calls `tokio::fs`, `io`, `process`, `net`, `sync` or `signal`.
# The graph still receives `net` and `sync` because `reqwest` enables them in
# every build, and `io-util` through reqwest's h2/hyper tree. Those are
# requests made by dependencies, not features this package asks for; the
# saving is every feature that neither this list nor a dependency requests.
# `fs` is not in this package's own graph:
# `reqwest`'s `stream` feature is what pulls `tokio/fs`, and this manifest does
# not enable it. A `--workspace` build unifies the repair binary's
# `reqwest/stream` into the same tokio, and then it is.
# `default-features = false` keeps the request to exactly this list; reqwest's
# dependency tree still enables tokio's empty `default` feature, which adds
# nothing. `spawn`/`spawn_blocking`/`JoinSet` come with `rt`, which
# `rt-multi-thread` already includes.
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
# URL parsing for `config::validate_base`: the absolute/https/loopback checks on
# the two API base overrides. This is the same `url` crate that `reqwest`
# re-exports as `Url` (already in the lockfile), so parsing, `scheme()`,
# `host_str()` and `as_str()` are unchanged. The transport and its native TLS /
# hyper tree are owned solely by `gircap-http`; gircap no longer takes a direct
# `reqwest` dependency. No `json` and no `stream` were requested here either:
# every body is decoded with `serde_json::from_slice` or handed on as raw bytes.
url = "2.5.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
prost = "0.14.6"
# The shared Sophon wire types: one byte layout for the three protobuf messages
# both programs decode. The leaf owns tags and field names only; gircap's dump
# key names are preserved and every measurement/validation helper stays local.
girpr-proto = { path = "../../crates/proto" }
# The shared region values — the three ids, their launcher/game/channel tuples,
# the four production bases and the two byte-stable constants. A logic-free
# leaf: gircap keeps its own `Biz::resolve`, its `Endpoints` override seam and
# its request builders. `clap` is on because `Biz` is the `--biz` flag type.
girpr-model = { path = "../../crates/model", features = ["clap"] }
# Hex spelling of digests, shared with the repair binary and the converter. A
# leaf mechanics crate: gircap still publishes lowercase hex strings and owns
# its own algorithm set, it only borrows the spelling.
girpr-digest = { path = "../../crates/digest" }
# The chunk-identity value types and the digest-normalisation rule, shared with
# the repair binary. The leaf owns the borrowed `(digest hex, length)` view and
# the case-insensitive parse; gircap keeps the normalisation at its single
# decode boundary, its set/collision policy, first-match order and every
# published byte.
girpr-chunk-identity = { path = "../../crates/chunk-identity" }
# The saturating download-projection fold, shared with the repair binary. A
# logic-free leaf with no program policy: gircap marks every wanted chunk as a
# download and keeps its retention sets, its artifact ranking and every
# published byte.
girpr-chunk-cost = { path = "../../crates/chunk-cost" }
# The Windows device-name predicate mechanism, shared with the repair binary.
# A leaf crate that owns only the mechanism: gircap keeps its exact rule (no
# `CLOCK$`, raw-stem comparison) by passing the reserved set and trim flag.
girpr-fs-names = { path = "../../crates/fs-names" }
# The lexical relative-path shape validator, shared with the repair binary. A
# logic-free leaf: gircap passes its strict spelling policy and its own device
# rule, and keeps its stable rule IDs, messages and every published byte here.
girpr-path-shape = { path = "../../crates/path-shape" }
# The shared lower + `_`→`-` audio-token primitive and the four canonical
# code/display-name pairs. The leaf holds no audio policy: gircap keeps its own
# trimming, ASCII folding, `none` sentinel and path-component validation, and
# writes the same scan-file bytes as the repair binary for the same selection.
girpr-audio-language = { path = "../../crates/audio-language" }
# The ordered-JSON writer and the one newline-appending line writer. A logic-free
# leaf: it emits the entries in the order gircap supplies, with gircap's own
# `event` value, `Val` types, `serde_json` escaping and `true`/`false` spelling.
girpr-report-core = { path = "../../crates/report-core" }
# Percent-escape spelling for query values and the stdout text form. Already in
# the lockfile through `reqwest`/`url`; named here so this crate uses it directly.
percent-encoding = "2.3.2"
# SHA-256 is computed inside `girpr-digest`, shared by all three programs;
# this crate only publishes its lowercase hex, so it no longer depends on the
# hasher directly.
flate2 = "1.1.11"
# Directory walks in the index and inventory passes. Already in the shared
# lockfile through the other workspace members; no new dependency is fetched.
walkdir = "2.5.1"
# The `game/config.ini` version probe. A streaming parser is used rather than a
# map-building one (`configparser`/`ini`) because gircap takes the FIRST
# `game_version` in `[General]`; a hash map keeps only the last. This keeps that
# reader's policy distinct from the repair binary's last-match/no-section rule.
ini_core = "0.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
# Only the `non_blocking` writer guard, which is what flushes the tail of a
# --log-file run. No rolling: a capture writes one log, it is not a daemon.
tracing-appender = "0.2.5"
chrono = { version = "0.4.45", features = ["clock"] }

[dev-dependencies]
# gircap's own test modules exercise `hash::gzip`, the test-only reference
# encoder that stays out of the shipped crate unless this feature is opted into.
gircap-hash = { path = "hash", features = ["test-support"] }
# `tests/cli_contract.rs` asserts on `--output json` records, so it parses them.
serde_json = "1.0.154"
# Only the unit/integration tests build zstd frames to feed the decode helpers.
# Production zstd lives in `gircap-hash`, which gircap depends on directly, so
# this native tree is not rebuilt when emit/blobs/manifest change.
zstd = "0.14.4"
# The self-contained offline capture mock and fixture builders, reached through
# the thin `tests/common/mod.rs` shim so they compile once for all integration
# binaries. A gircap-only dev library: it depends on this package's public
# seams, not on the repair binary's mock.
gircap-test-support = { path = "test-support" }
# The scratch-directory helper, shared with the repair binary and with
# `girsync`: one name, one construction and one cleanup for every test in the
# workspace. A dev-dependency, because nothing that ships creates a scratch
# directory.
girpr-tempdir = { path = "../../crates/tempdir" }
# Canned reply servers in the HTTP unit tests use the dependency-free loopback
# leaf: it owns the listener, request journal and invocation counts, and these
# tests script its statuses/bodies and assert on what it recorded. The
# malformed-response tests keep a small raw-socket helper, because a
# well-behaved mock server cannot lie about `Content-Length`.
girpr-loopback-mock = { path = "../../crates/loopback-mock" }

# Deliberately absent: `twox-hash`. The 16-hex manifest-id prefix is not a hash
# of any observable input (docs/00-spec.md §3.7), so an xxh64 implementation
# would be unused code asserting something false.