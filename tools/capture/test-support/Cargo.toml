[package]
name = "gircap-test-support"
version.workspace = true
edition.workspace = true
# Built with the stable Rust toolchain selected at the workspace root.
description = "The self-contained offline capture mock and fixture builders shared by the gircap integration tests"

[lib]
name = "gircap_test_support"
path = "src/lib.rs"

# The same tools-only policy gircap itself uses: the mock asserts with
# `unwrap`/`expect` throughout, so the workspace's `unwrap_used`/`expect_used`
# warnings would be noise for a test-only crate. The `gircap-` prefix, the
# `tools/capture/` home and this local lint table are a deliberate deviation
# from the shared-crate convention (which uses `girpr-<policy>` in `crates/`
# and `[lints] workspace = true`); do not "correct" them.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dependencies]
# A test-only inversion: the mock drives gircap's own public run/HTTP seams so it
# agrees with the code under test by construction, never by borrowing the repair
# binary's mock (docs/00-spec.md §2: no shared fixtures, no coupling).
gircap = { path = ".." }
# The shared clamp-then-widen byte arithmetic, so a fixture's declared totals
# are folded by the same rule the manifest decoder applies to them.
girpr-chunk-cost = { path = "../../../crates/chunk-cost" }
# The scratch-directory policy, shared with the other two programs' tests only
# as a naming/cleanup leaf; no program logic crosses with it.
girpr-tempdir = { path = "../../../crates/tempdir" }
# The shared bundle is published under a cross-process file lock; every test
# process must agree on the one on-disk tree.
fs2 = { workspace = true }
serde_json = { workspace = true }
# The ordered fixture value implements `serde::Serialize` itself so keys keep
# insertion order without `serde_json/preserve_order` (which would reorder
# `Value` objects for unrelated consumers in this workspace).
serde = { workspace = true }
# Request queries are decoded by the shared grammar leaf rather than a local
# `%XX`/`+` loop; the leaf borrows `url`'s form decoder (already in the lockfile).
girpr-request-url = { path = "../../../crates/request-url" }
# The `gircap` sentinel prepended to dispatched argv is supplied by this call
# site to the shared helper: capture records the full vector in
# `MANIFEST.json → tool_argv`, so its spelling is a byte contract owned here.
girpr-cli = { path = "../../../crates/cli" }
# The canned manifest bodies are protobuf frames the mock encodes by hand.
prost = { workspace = true }
# axum owns the mock's listener, HTTP parsing, keep-alive, routing and header
# writing. A regular dependency, not a dev-dependency: this crate is consumed as
# a library by gircap's integration tests, and a dev-dependency of a library is
# not linked into those consumers. Only `http1`/`tokio` are needed (the mock is
# HTTP/1.1); the rest of the workspace already resolves the same axum 0.8.9.
axum = { workspace = true, default-features = false, features = ["http1", "tokio"] }
# `block_on` drives gircap's async command dispatch on a current-thread runtime;
# `net`/`time`/`sync` drive the axum server's listener, idle connections and
# shutdown signal on its own current-thread runtime.
tokio = { workspace = true, default-features = false, features = ["rt", "net", "time", "sync"] }
# Chunk and manifest bodies are zstd frames on the wire.
zstd = { workspace = true }
# 64-bit FNV-1a for the shared bundle cache key; only change detection matters.
fnv = { workspace = true }
# Recursive source/bundle discovery with deterministic per-directory ordering.
walkdir = { workspace = true }
