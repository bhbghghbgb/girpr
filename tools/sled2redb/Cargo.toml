[package]
name = "sled2redb"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "Dev-only one-shot converter from a legacy sled cache directory to a redb cache file, extracted from girsync"

# A tools-only subset of the shared policy, the same one the other two dev
# tools use. A panic in a dev tool is a failed developer run, not a failed
# repair of a user's install, so `unwrap_used`/`expect_used` stay warnings.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[lib]
name = "sled2redb"
path = "src/lib.rs"

[[bin]]
name = "sled2redb"
path = "src/main.rs"

[dependencies]
# The converter reads a legacy sled database and writes the redb cache through
# girsync's public cache/hash/util/report API. `sled` is a plain dependency of
# this crate alone; girsync itself has no sled in its graph at all.
girsync = { path = "../sync" }
# The temporary the finished cache is moved from: `tempfile` claims a unique
# name in the destination's folder, its no-clobber rename puts the finished
# file in place, and dropping the handle on failure leaves no residue.
tempfile = "3.27"
sled = "0.34"
anyhow = "1.0.105"
# Hex decoding of legacy digest strings, with the bad-row context kept here in
# the caller. The shared crate supplies only the decode primitive.
girpr-digest = { path = "../../crates/digest" }
# The cache and its wire vocabulary are read from the upstream crate directly,
# not through girsync's lib facade: an unrelated girsync edit leaves this
# converter's cache code and its redb/postcard/tempfile tree cached.
girsync-cache = { path = "../sync/cache" }
# The clap-error to usage-code mapping mechanics, shared with the repair
# binary and `gircap`. The leaf only decides help/version -> 0, else the usage
# code passed in; this binary keeps its `e.exit()` and literal `3` boundary.
girpr-cli = { path = "../../crates/cli" }
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
# `tests/convert.rs` builds legacy sled fixtures with the two hash crates and
# shares the workspace's scratch-directory policy with the other dev tools.
md-5 = "0.11.0"
sha2 = "0.11.1"
girpr-tempdir = { path = "../../crates/tempdir" }
# The girsync-coupled fixtures shared with `girsync`'s test suites. This crate
# already depends on girsync normally, so the fixtures add no new program edge.
girsync-test-support = { path = "../sync/test-support" }
