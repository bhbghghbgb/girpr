[package]
name = "girsync"
version = "0.1.0"
edition = "2024"
# redb 4.1.0 needs 1.89; nothing else in its tree needs more.
rust-version = "1.89"
description = "Dev-only one-way folder mirror (src old-version -> dst working dir) with redb hash cache"

# A tools-only subset of the shared policy. The dev tools do not inherit the
# workspace table because `unwrap_used`/`expect_used` are deliberate there for
# the repair path and would be noise here: a panic in a dev tool is a failed
# developer run, not a failed repair of a user's install. What is checked is
# `clippy::all` plus denied `unsafe_code`, the same as the product otherwise.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[lib]
name = "girsync"
path = "src/lib.rs"

[[bin]]
name = "girsync"
path = "src/main.rs"

[[bin]]
name = "sled2redb"
path = "src/bin/sled2redb.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# The log-file and log-level policy, shared with the repair binary and with
# `gircap`. It is a leaf crate with no dependency on any of the three
# programs, so sharing it couples nothing that matters.
girpr-log = { path = "../../crates/log" }
anyhow = "1"
walkdir = "2"
# sled is used ONLY by the one-shot `sled2redb` converter (src/convert.rs).
# All live cache paths use redb.
sled = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
glob = "0.3"
chrono = { version = "0.4", features = ["clock"] }
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
# Pinned to the last 4.x release that supports this crate's declared minimum
# of Rust 1.89: 4.2 and later require 1.90.
redb = "=4.1.0"

# Hard-link count for the copy guard. `std` exposes `nlink` on Unix but Windows'
# `MetadataExt::number_of_links` is still unstable (`windows_by_handle`) on the
# toolchain this crate builds with, so the count comes from
# `GetFileInformationByHandle`. The dependency is Windows-only, where it is used.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

# Integration tests in tests/ only see the lib's public API plus dev-deps,
# so the crate the tests poke at directly is repeated here.
[dev-dependencies]
md-5 = "0.10"
# The stdout assertions read `--output json` records, so they build the expected
# ones with `json!` rather than comparing rendered text.
serde_json = "1"
# `tests/rw_threads.rs` checks the flag surface with `Cli::try_parse_from` rather
# than spawning the binary, so a mutual-exclusion table can be stated exhaustively
# for the price of a table. Same crate the lib already uses, so it costs no build.
clap = { version = "4", features = ["derive"] }
# The scratch-directory helper, shared with the repair binary and with
# `gircap`: one name, one construction and one cleanup for every test in the
# workspace. A dev-dependency, because nothing that ships creates a scratch
# directory.
girpr-tempdir = { path = "../../crates/tempdir" }
