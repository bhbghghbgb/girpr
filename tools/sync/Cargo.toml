[package]
name = "girsync"
version = "0.1.0"
edition = "2021"
description = "Dev-only one-way folder mirror (src old-version -> dst working dir) with sled hash cache"

[[bin]]
name = "girsync"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
walkdir = "2"
sled = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
sha2 = "0.10"
glob = "0.3"
chrono = { version = "0.4", features = ["clock"] }
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
