[package]
name = "girsync"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "Dev-only one-way folder mirror (src old-version -> dst working dir) with redb hash cache"

# A tools-only subset of the shared policy. The dev tools do not inherit the
# workspace table because `unwrap_used`/`expect_used` are deliberate there for
# the repair path and would be noise here: a panic in a dev tool is a failed
# developer run, not a failed repair of a user's install. What is checked is
# `clippy::all` plus denied `unsafe_code`, the same as the product otherwise.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[lib]
name = "girsync"
path = "src/lib.rs"

[[bin]]
name = "girsync"
path = "src/main.rs"

# The benchmark target: a plain `main` that prints numbers. No harness, no
# criterion, no new dependency — and no assertion about how long anything took,
# so it is a local measurement aid rather than a gate.
[[bench]]
name = "tree_shapes"
path = "benches/tree_shapes.rs"
harness = false

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
# The log-file and log-level policy, shared with the repair binary and with
# `gircap`. It is a leaf crate with no dependency on any of the three
# programs, so sharing it couples nothing that matters.
girpr-log = { path = "../../crates/log" }
# Shared Windows path-name mechanics (device names, trailing dot/space, ASCII
# fold, forward slash). Each call site passes its own policy; no program rule is
# borrowed, so this couples no program to another.
girpr-fs-names = { path = "../../crates/fs-names" }
# The shared streaming digest mechanics: a byte-absorbing sink and a reader
# helper parameterised by algorithm set and buffer size. This crate keeps its
# own AlgoSet/DigestSet/HashAlg vocabulary and maps to the leaf at the call site.
girpr-digest = { path = "../../crates/digest" }
anyhow = "1.0.104"
walkdir = "2.5.0"
# The redb cache (with `redb`, its positional `postcard` codec and `tempfile`
# working names) now lives in its own crate below this lib. This binary and its
# tests depend on it directly, so an edit to the planner, commands or other
# modules here leaves the whole cache and its native dependency tree cached.
# It also owns the digest vocabulary the wire format pins, so girsync's `hash`
# module is a re-export of it and the cache never depends back on this lib.
girpr-sync-cache = { path = "../../crates/sync-cache" }
# The acyclic leaves (rw limits/gate, the include/exclude filter, the link and
# hardlink facts) live in one upstream crate this lib and its tests depend on
# directly. An edit to the planner, commands or config here leaves all four
# leaves and tokio's semaphore cached instead of recompiling them. The crate is
# consumed directly by its own integration tests too, so it is not merely
# re-exported by this facade.
girpr-sync-leaves = { path = "../../crates/sync-leaves" }
# Path canonicalization for identity and link-target checks. It resolves links
# like `std::fs::canonicalize` but omits the Windows `\\?\` prefix, so a
# canonical path can be compared with a link's own spelling without stripping.
dunce = "1.0.5"
# No `sled`: the legacy-format converter moved out to the standalone
# `tools/sled2redb` crate, so this package's graph is sled-free.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The hashers themselves come from `girpr-digest` now; this crate keeps its own
# algorithm vocabulary and maps it at the call site. `md-5` remains a
# dev-dependency for the tests that build digests by hand.
# The shared --include/--exclude glob rules, used by this crate and by girpr.
# Re-exported at the crate root so callers name the same `glob::Pattern` type.
girpr-filter = { path = "../../crates/filter" }
# Ordered-JSON and line-writing mechanics for the stdout data plane. This
# crate keeps its own alphabetical key order, `serde_json::Value` fields and
# record layouts; the leaf only writes the object in the order asked for.
girpr-report-core = { path = "../../crates/report-core" }
rayon = "1.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"

# Integration tests in tests/ only see the lib's public API plus dev-deps,
# so the crate the tests poke at directly is repeated here.
[dev-dependencies]
md-5 = "0.11.0"
# The stdout assertions read `--output json` records, so they build the expected
# ones with `json!` rather than comparing rendered text.
serde_json = "1.0.154"
# `tests/rw_threads.rs` checks the flag surface with `Cli::try_parse_from` rather
# than spawning the binary, so a mutual-exclusion table can be stated exhaustively
# for the price of a table. Same crate the lib already uses, so it costs no build.
clap = { version = "4.6.8", features = ["derive"] }
# The scratch-directory helper, shared with the repair binary and with
# `gircap`: one name, one construction and one cleanup for every test in the
# workspace. A dev-dependency, because nothing that ships creates a scratch
# directory.
girpr-tempdir = { path = "../../crates/tempdir" }
# The girsync-coupled test fixtures (option/cache/planner builders) that used to
# live in `girpr-tempdir::test_support`. This crate already depends on girsync,
# so it is the right place for them; the scratch-directory crate stays free of
# girsync for the programs that do not otherwise use it.
girpr-sync-test-support = { path = "../../crates/sync-test-support" }
