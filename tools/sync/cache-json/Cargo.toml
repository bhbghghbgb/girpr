[package]
name = "girsync-cache-json"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "NDJSON export/import for the girsync redb cache, current schema only"

# The same tools-only policy girsync and its other crates use: this crate holds
# conversion mechanics, not a repair path, so `unwrap_used`/`expect_used`
# warnings would be noise. `clippy::all` and denied `unsafe_code` still apply.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[lib]
name = "girsync_cache_json"
path = "src/lib.rs"

[[bin]]
name = "cache-json"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The JSON boundary spells digests with the shared hex wrappers; this converter
# borrows them from the digest leaf instead of spelling hex on its own.
girpr-digest = { path = "../../../crates/digest" }
# The import claims a temp sibling beside the destination through the shared
# atomic claim primitive and publishes the whole cache in one rename, so a
# failed import leaves the old cache intact.
girpr-util-path = { path = "../../../app/util-path" }
# The clap-error to usage-code mapping, shared with girsync. The
# leaf decides only help/version -> 0; this binary owns its failure code.
girpr-cli = { path = "../../../crates/cli" }
# The redb cache, its public read/write API and its schema version. Reached
# directly rather than through girsync's lib facade: an edit to a planner or a
# command leaves this converter's cache tree cached.
girsync-cache = { path = "../cache" }

[dev-dependencies]
# The round-trip tests build fixture caches in one scratch tree per test.
girpr-tempdir = { path = "../../../crates/tempdir" }
