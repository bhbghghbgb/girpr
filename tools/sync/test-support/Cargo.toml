[package]
name = "girsync-test-support"
version = "0.1.0"
edition = "2024"
# Built with the stable Rust toolchain selected at the workspace root.
description = "The girsync-owned test fixtures: builders for the option, cache and planner types the dev tools' tests hand to girsync"

[lib]
name = "girsync_test_support"
path = "src/lib.rs"

# The same tools-only policy girsync and its other crates use: these fixtures
# hold no repair path, so `unwrap_used`/`expect_used` warnings would be noise.
# `clippy::all` and denied `unsafe_code` still apply.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dependencies]
# These fixtures exist only to compile girsync option/cache/planner types and to
# read the NDJSON the tool emits. They live here rather than in girpr-tempdir so
# that the scratch-directory policy stays a girsync-free leaf: programs that do
# not otherwise use girsync (the repair binary and gircap) keep their test builds
# out of girsync's rebuild cascade. Only girsync takes this crate as a
# dev-dependency.
girsync = { path = ".." }
serde_json = "1.0.154"
# The in-process CLI runner glue parses argv through clap's `Parser` trait, and
# the full-argv spelling it hands the parser is the shared `argv_with_program`
# helper (the caller supplies the `girsync` sentinel).
clap = "4.6.10"
girpr-cli = { path = "../../../crates/cli" }
# The logged runner installs girsync's subscriber and renders the console into a
# shared buffer, so it names `tracing`/`tracing-subscriber` directly. These are
# already in girsync's graph; naming them here only makes the dependency real.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
# The fixture trees are still named and removed by the shared scratch-directory
# policy; re-exported below so every call site keeps the same surface.
girpr-tempdir = { path = "../../../crates/tempdir" }
# The capture-buffer storage primitive. It owns the bytes and `Write` only; this
# crate keeps its own lossy text rendering and installs girsync's subscriber
# stack, so sharing it pulls no program crate into the log leaf.
girpr-log = { path = "../../../crates/log", features = ["test-support"] }
# `age()` moves fixture mtimes by a whole number of seconds without rounding
# away the existing sub-second part; filetime owns that arithmetic.
filetime = "0.2.30"
